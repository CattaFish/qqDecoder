name: Crawl All QQ SubIDs (Since 2025)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '回溯抓取的起始日期 (格式: YYYY-MM-DD)'
        required: false
        default: '2025-01-01'
        type: string

concurrency:
  group: crawl-qq-subids
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  batch-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装底层解包工具与系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full rpm2cpio cpio curl aapt

      - name: 安装 Python 网页解析依赖
        run: |
          pip install requests beautifulsoup4

      - name: 安装官方 tdl 客户端
        run: |
          echo "正在安装 tdl..."
          curl -sSL https://docs.iyear.me/tdl/install.sh | sudo bash
          tdl version

      - name: 恢复 Telegram 登录会话
        run: |
          echo "正在恢复已授权的 tdl 登录状态..."
          echo "${{ secrets.TDL_SESSION_BASE64 }}" | base64 -d > backup.zip
          tdl recover -f backup.zip
          rm backup.zip

      - name: 运行全量历史回溯与提取流水线
        env:
          START_DATE: ${{ inputs.start_date || '2025-01-01' }}
          MAX_RUNTIME_MINUTES: "280"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/build_subid_database.py

      - name: 提交更新后的数据字典到仓库
        if: always() # 无论正常结束还是中断，绝对执行提交
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          # 1. 暂存 data/ 目录中的所有有效成果
          git add data/
          if git diff --staged --quiet; then
            echo "[状态] 没有新数据生成，跳过提交。"
          else
            git commit -m "Auto-database: update QQ SubID mapping [skip ci]"

            # 2. 核心修复：强制清除工作区除了已提交数据之外的所有临时杂质，确保工作区 100% 绝对纯净！
            git checkout -- . 2>/dev/null || true
            git clean -fd

            # 3. 循环重试拉取远程并推送（最多重试 5 次，彻底消除并发与远程领先冲突）
            for i in {1..5}; do
              echo "[同步] 正在尝试合并远程分支并推送 (尝试 $i/5)..."
              git fetch origin main

              # 优先使用变基，若有冲突则自动使用合并策略，以本地提取出的 data 数据为准
              if git rebase origin/main 2>/dev/null; then
                if git push origin main; then
                  echo "[成功] 数据已通过变基成功推送到远程仓库！"
                  break
                fi
              else
                echo "[策略切换] 变基遇阻，自动切换为安全合并策略..."
                git rebase --abort 2>/dev/null || true
                git merge origin/main -m "Merge remote changes [skip ci]" --strategy-option ours || true
                if git push origin main; then
                  echo "[成功] 数据已通过合并策略成功推送到远程仓库！"
                  break
                fi
              fi
              sleep 3
            done
          fi

          # 4. 自动接力：如果发现仍有未跑完的任务，唤起下一次接力
          if [ -f "data/.has_more" ]; then
            echo "[自动接力] 检测到仍有未完成任务，正在自动触发下一次任务继续断点续传..."
            gh workflow run "Crawl All QQ SubIDs (Since 2025)" || true
          fi
