name: Universal Extract QQAppId

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: '请输入 QQ 安装包直链（支持 .exe / .deb / .AppImage / .dmg / .rpm / .apk）'
        required: true
        type: string
        default: 'https://dldir1.qq.com/qqfile/qq/QQNT/mac/QQ_6.9.86_42941.dmg'

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 下载安装包
        run: |
          echo "正在下载: ${{ inputs.download_url }}"
          curl -fL -o package_file "${{ inputs.download_url }}"
          ls -lh package_file

      - name: 2. 智能识别格式并解压
        run: |
          URL="${{ inputs.download_url }}"
          CLEAN_URL="${URL%%\?*}"
          mkdir -p qq_extracted

          if [[ "$CLEAN_URL" =~ \.apk$ ]]; then
            echo "[格式识别] Android 安装包 (.apk)"
            7z x package_file -oqq_extracted -y || true
            # 尝试调用系统自带的 aapt 将二进制 AndroidManifest.xml 转储为明文
            AAPT_BIN=$(which aapt || find "$ANDROID_HOME/build-tools" -name aapt 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$AAPT_BIN" ]; then
              echo "[状态] 找到 aapt 工具，正在导出 AndroidManifest.xml 明文..."
              $AAPT_BIN dump xmltree package_file AndroidManifest.xml > qq_extracted/manifest_dump.txt 2>/dev/null || true
            fi

          elif [[ "$CLEAN_URL" =~ \.dmg$ ]]; then
            echo "[格式识别] macOS 磁盘镜像 (.dmg)"
            7z x package_file -oqq_extracted -y || true
            HFS_FILE=$(find qq_extracted -type f \( -name "*.hfs" -o -name "*Apple_HFS*" \) | head -n 1)
            if [ -n "$HFS_FILE" ]; then
              echo "[状态] 发现嵌套 HFS 磁盘分区镜像，正在二次解包..."
              7z x "$HFS_FILE" -oqq_extracted_hfs -y || true
              cp -r qq_extracted_hfs/* qq_extracted/ 2>/dev/null || true
            fi

          elif [[ "$CLEAN_URL" =~ \.deb$ ]]; then
            echo "[格式识别] Linux Debian/Ubuntu 安装包 (.deb)"
            dpkg-deb -x package_file qq_extracted

          elif [[ "$CLEAN_URL" =~ \.AppImage$ ]]; then
            echo "[格式识别] Linux AppImage"
            7z x package_file -oqq_extracted -y || true

          elif [[ "$CLEAN_URL" =~ \.exe$ ]]; then
            echo "[格式识别] Windows 安装包 (.exe)"
            7z x package_file -oqq_extracted -y || true

          elif [[ "$CLEAN_URL" =~ \.rpm$ ]]; then
            echo "[格式识别] Linux RPM 安装包 (.rpm)"
            sudo apt-get update && sudo apt-get install -y rpm2cpio cpio
            cd qq_extracted && rpm2cpio ../package_file | cpio -idmv && cd ..

          else
            echo "[格式识别] 未知后缀，使用 7z 通用解包"
            7z x package_file -oqq_extracted -y || true
          fi

      - name: 3. 定位并提取 QQAppId
        id: parse_appid
        run: |
          python3 - << 'EOF'
          import re
          import os
          import sys
          from pathlib import Path

          root_dir = Path("qq_extracted")

          # ----------------------------------------------------
          # 分支 A: 处理 Android 平台 (APK)
          # ----------------------------------------------------
          manifest_xml = root_dir / "AndroidManifest.xml"
          manifest_dump = root_dir / "manifest_dump.txt"

          if manifest_dump.exists() or manifest_xml.exists():
              platform = "Android"
              hit_file = "AndroidManifest.xml"
              app_id_phone = ""
              app_id_pad = ""

              # 方案 1: 读取 aapt 导出的明文
              if manifest_dump.exists():
                  text = manifest_dump.read_text(encoding="utf-8", errors="ignore")
                  m_phone = re.search(r'AppSetting_params".*?value.*?="([0-9]+)#', text, re.DOTALL)
                  m_pad = re.search(r'AppSetting_params_pad".*?value.*?="([0-9]+)#', text, re.DOTALL)
                  if m_phone:
                      app_id_phone = m_phone.group(1)
                  if m_pad:
                      app_id_pad = m_pad.group(1)

              # 方案 2: 直接通过字节流正则扫描二进制 AndroidManifest.xml
              if not app_id_phone and manifest_xml.exists():
                  raw_bytes = manifest_xml.read_bytes()
                  # 匹配格式: <9位数字>#<16位Hex密钥>#
                  matches_u8 = re.findall(rb"([0-9]{9})#[A-Fa-f0-9]{16}#", raw_bytes)
                  matches_u16 = [
                      m.replace(b"\x00", b"")
                      for m in re.findall(rb"((?:[0-9]\x00){9})#\x00(?:[A-Fa-f0-9]\x00){16}#\x00", raw_bytes)
                  ]
                  all_matches = [m.decode("ascii") for m in (matches_u8 + matches_u16)]
                  if len(all_matches) >= 1:
                      app_id_phone = all_matches[0]
                  if len(all_matches) >= 2:
                      app_id_pad = all_matches[1]

              if not app_id_phone:
                  print("::error::未在 AndroidManifest.xml 中检索到 AppSetting_params！")
                  sys.exit(1)

              final_appid = app_id_phone

              print("\n" + "="*45)
              print(f"识别目标平台: {platform}")
              print(f"成功提取 QQAppId (Phone): {app_id_phone}")
              if app_id_pad:
                  print(f"成功提取 QQAppId (Pad):   {app_id_pad}")
              print(f"命中物理文件: {hit_file}")
              print("="*45 + "\n")

              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"app_id={final_appid}\n")
                  if app_id_pad:
                      f.write(f"app_id_pad={app_id_pad}\n")
                  f.write(f"platform={platform}\n")

              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write("### QQAppId 自动定位报告\n\n")
                  f.write(f"- **目标平台**: `{platform}`\n")
                  f.write(f"- **QQAppId (Phone)**: `{app_id_phone}`\n")
                  if app_id_pad:
                      f.write(f"- **QQAppId (Pad)**: `{app_id_pad}`\n")
                  f.write(f"- **模块文件**: `{hit_file}`\n")

              sys.exit(0)

          # ----------------------------------------------------
          # 分支 B: 处理桌面端 NT (Windows, Linux, macOS)
          # ----------------------------------------------------
          target_files = list(root_dir.glob("**/major.node"))
          if not target_files:
              print("提示: 未在默认路径找到 major.node，正在检索所有 .node 模块...")
              target_files = list(root_dir.glob("**/*.node"))

          if not target_files:
              print("::error::未在解压结果中找到任何 .node 原生模块！")
              sys.exit(1)

          print(f"待分析文件: {[str(p) for p in target_files]}")

          pattern = re.compile(rb"QQAppId/([0-9]+)")
          matched_ids = set()
          hit_file = ""

          for fpath in target_files:
              try:
                  content = fpath.read_bytes()
                  results = pattern.findall(content)
                  for r in results:
                      matched_ids.add(r.decode('ascii'))
                      hit_file = str(fpath)
              except Exception as e:
                  print(f"读取文件 {fpath} 出错: {e}")

          if not matched_ids:
              print("::error::未检测到 QQAppId 特征码！")
              sys.exit(1)

          final_appid = list(matched_ids)[0]

          platform = "Unknown"
          if ".app" in hit_file or "MacOS" in hit_file:
              platform = "macOS"
          elif "opt" in hit_file or "linux" in hit_file.lower():
              platform = "Linux"
          elif "versions" in hit_file or "Files" in hit_file:
              platform = "Windows"

          print("\n" + "="*45)
          print(f"识别目标平台: {platform}")
          print(f"成功提取 QQAppId: {final_appid}")
          print(f"命中物理文件: {hit_file}")
          print("="*45 + "\n")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"app_id={final_appid}\n")
              f.write(f"platform={platform}\n")

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("### QQAppId 自动定位报告\n\n")
              f.write(f"- **目标平台**: `{platform}`\n")
              f.write(f"- **QQAppId**: `{final_appid}`\n")
              f.write(f"- **模块文件**: `{hit_file}`\n")
          EOF

      - name: 4. 检查提取结果
        run: |
          echo "平台: ${{ steps.parse_appid.outputs.platform }}"
          echo "ID:   ${{ steps.parse_appid.outputs.app_id }}"
          if [ -n "${{ steps.parse_appid.outputs.app_id_pad }}" ]; then
            echo "Pad ID: ${{ steps.parse_appid.outputs.app_id_pad }}"
          fi
