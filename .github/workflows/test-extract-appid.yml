name: Universal Extract QQAppId (Win & Linux)

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: '请输入 QQ 安装包直链（支持 .exe / .deb / .AppImage）'
        required: true
        type: string
        default: 'https://dldir1.qq.com/qqfile/qq/QQNT/Linux/qq_3.2.22_241219_amd64_01.deb'

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 下载安装包
        run: |
          echo "正在下载: ${{ inputs.download_url }}"
          # 去除 URL 参数后保留后缀名，以便后续判断格式
          curl -fL -o package_file "${{ inputs.download_url }}"
          ls -lh package_file

      - name: 2. 智能识别格式并解压
        run: |
          URL="${{ inputs.download_url }}"
          # 提取纯净 URL 后缀（剔除 ? 后的查询参数）
          CLEAN_URL="${URL%%\?*}"
          mkdir -p qq_extracted

          if [[ "$CLEAN_URL" =~ \.deb$ ]]; then
            echo "📦 检测到 Linux Debian/Ubuntu 安装包 (.deb)，使用 dpkg-deb 解压..."
            dpkg-deb -x package_file qq_extracted

          elif [[ "$CLEAN_URL" =~ \.AppImage$ ]]; then
            echo "📦 检测到 Linux AppImage，使用 7z 解压..."
            7z x package_file -oqq_extracted -y || true

          elif [[ "$CLEAN_URL" =~ \.exe$ ]]; then
            echo "📦 检测到 Windows 安装包 (.exe)，使用 7z 解压..."
            7z x package_file -oqq_extracted -y || true

          elif [[ "$CLEAN_URL" =~ \.rpm$ ]]; then
            echo "📦 检测到 Linux RPM 安装包 (.rpm)..."
            sudo apt-get update && sudo apt-get install -y rpm2cpio cpio
            cd qq_extracted && rpm2cpio ../package_file | cpio -idmv && cd ..

          else
            echo "⚠️ 未识别文件后缀，尝试使用 7z 通用解包..."
            7z x package_file -oqq_extracted -y || true
          fi

      - name: 3. 定位并提取 QQAppId
        id: parse_appid
        run: |
          python3 - << 'EOF'
          import re
          import os
          import sys
          from pathlib import Path

          root_dir = Path("qq_extracted")

          # 优先匹配 major.node，兜底匹配所有 .node 动态库
          target_files = list(root_dir.glob("**/major.node"))
          if not target_files:
              print("提示: 未在常规路径找到 major.node，正在全盘检索 .node 模块...")
              target_files = list(root_dir.glob("**/*.node"))

          if not target_files:
              print("::error::解压目录中未找到任何 .node 模块！")
              sys.exit(1)

          print(f"找到待分析模块: {[str(p) for p in target_files]}")

          # 正则锚点：匹配单字节流中的 "QQAppId/<纯数字>"
          pattern = re.compile(rb"QQAppId/([0-9]+)")
          matched_ids = set()
          hit_file = ""

          for fpath in target_files:
              try:
                  content = fpath.read_bytes()
                  results = pattern.findall(content)
                  for r in results:
                      matched_ids.add(r.decode('ascii'))
                      hit_file = str(fpath)
              except Exception as e:
                  print(f"读取文件 {fpath} 出错: {e}")

          # 校验与输出
          if not matched_ids:
              print("::error::未检测到 QQAppId 特征码，可能格式发生了变动！")
              sys.exit(1)

          if len(matched_ids) > 1:
              print(f"::warning::检测到多个不同的 AppId: {matched_ids}")

          final_appid = list(matched_ids)[0]
          print(f"\n" + "="*45)
          print(f"🎉 成功提取 QQAppId: {final_appid}")
          print(f"📁 命中文件路径: {hit_file}")
          print(f"="*45 + "\n")

          # 写入 Step 输出
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"app_id={final_appid}\n")

          # 写入 Action 运行摘要 (Markdown 卡片)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("### 🚀 QQAppId 提取成功\n\n")
              f.write(f"- **目标平台**: `{'Linux' if 'opt' in hit_file else 'Windows'}`\n")
              f.write(f"- **QQAppId**: `{final_appid}`\n")
              f.write(f"- **命中模块**: `{hit_file}`\n")
          EOF

      - name: 4. 检查结果
        run: |
          echo "本次提取出的 APP_ID 是: ${{ steps.parse_appid.outputs.app_id }}"
