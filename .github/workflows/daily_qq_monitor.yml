name: Daily QQ Monitor & SubID Sync

on:
  schedule:
    # 每天北京时间早上 8:00 (UTC 0:00) 自动执行检测
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: qq-subid-monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装底层解包工具与系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full rpm2cpio cpio curl aapt

      - name: 安装 Python 网页解析依赖
        run: |
          pip install requests beautifulsoup4

      - name: 安装官方 tdl 客户端
        run: |
          curl -sSL https://docs.iyear.me/tdl/install.sh | sudo bash
          tdl version

      - name: 恢复 Telegram 登录会话
        run: |
          echo "${{ secrets.TDL_SESSION_BASE64 }}" | base64 -d > backup.zip
          tdl recover -f backup.zip
          rm backup.zip

      - name: 运行每日增量监听与 SubID 追加
        id: monitor_step
        env:
          GH_TOKEN: ${{ github.token }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          ARMCONVERTER_SESSION: ${{ secrets.ARMCONVERTER_SESSION }}
        run: |
          python scripts/daily_monitor.py

      # ==========================================
      # 智能提交：完整收录数据与 .bak 容灾备份，纯净化推送
      # ==========================================
      - name: 提交更新后的数据字典与水位线到仓库
        if: steps.monitor_step.outputs.has_new_version == 'true' || steps.monitor_step.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          # 1. 暂存 data/ 目录下所有核心成果（包含主库、运行时字典、水位线与 .bak 容灾备份）
          git add data/

          if git diff --staged --quiet; then
            echo "[状态] 没有新数据生成，跳过提交。"
          else
            git commit -m "Auto-database: update QQ SubID mapping and watermarks [skip ci]"

            # 2. ★ 核心保障：清理工作区除 data/ 外的一切未跟踪杂质，确保工作区绝对纯净，杜绝 rebase 误判
            git checkout -- . 2>/dev/null || true
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            git clean -fd

            # 3. 稳健推送重试（最多重试 5 次）
            for i in {1..5}; do
              echo "[同步] 尝试推送到远程仓库 ($i/5)..."
              if git push origin main; then
                echo "[成功] 数据与 .bak 容灾备份已顺利推送到远程仓库！"
                break
              fi

              echo "[重试] 推送遇阻（远程有新提交），拉取最新分支进行变基合并..."
              git fetch origin main
              if git rebase origin/main 2>/dev/null; then
                if git push origin main; then
                  echo "[成功] 变基后数据已顺利推送到远程仓库！"
                  break
                fi
              else
                git rebase --abort 2>/dev/null || true
                git pull origin main --no-edit || true
                if git push origin main; then
                  echo "[成功] 合并后数据已顺利推送到远程仓库！"
                  break
                fi
              fi
              sleep 2
            done
          fi

      # ==========================================
      # 联动步骤：仅在检测到 Android 新版本时唤起全量反编译
      # ==========================================
      - name: 自动唤起 Android 反编译与 Diff 工作流
        if: steps.monitor_step.outputs.trigger_decompile == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "[联动触发] 检测到 Android 新版发布，唤醒 decompile 工作流并传递 APK 链接..."
          gh workflow run "Auto Decompile & Twinflame DEX Diff QQ APK" \
            -f apk_url="${{ steps.monitor_step.outputs.android_apk_url }}" \
            -f version_short="${{ steps.monitor_step.outputs.android_version }}" \
            -f is_beta="${{ steps.monitor_step.outputs.android_is_beta }}" \
            -f decompile_all="true"
