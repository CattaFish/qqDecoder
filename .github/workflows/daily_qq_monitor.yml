name: Daily QQ Monitor & SubID Sync

on:
  schedule:
    # 每天北京时间早上 8:00 (UTC 0:00) 自动执行检测
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: qq-subid-monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装底层解包工具与系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full rpm2cpio cpio curl aapt

      - name: 安装 Python 网页解析依赖
        run: |
          pip install requests beautifulsoup4

      - name: 安装官方 tdl 客户端
        run: |
          curl -sSL https://docs.iyear.me/tdl/install.sh | sudo bash
          tdl version

      - name: 恢复 Telegram 登录会话
        run: |
          echo "${{ secrets.TDL_SESSION_BASE64 }}" | base64 -d > backup.zip
          tdl recover -f backup.zip
          rm backup.zip

      - name: 运行每日增量监听与 SubID 追加
        id: monitor_step
        env:
          GH_TOKEN: ${{ github.token }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          ARMCONVERTER_SESSION: ${{ secrets.ARMCONVERTER_SESSION }}
        run: |
          python scripts/daily_monitor.py

      # ==========================================
      # 智能提交：冲突时基于最新 origin/main 重跑增量合入，彻底杜绝 JSON 破坏与分支分歧报错
      # ==========================================
      - name: 提交更新后的数据字典与水位线到仓库
        if: steps.monitor_step.outputs.has_new_version == 'true' || steps.monitor_step.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          ARMCONVERTER_SESSION: ${{ secrets.ARMCONVERTER_SESSION }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add data/

          if git diff --staged --quiet; then
            echo "[状态] 没有新数据生成，跳过提交。"
            exit 0
          fi

          git commit -m "Auto-database: update QQ SubID mapping and watermarks [skip ci]"

          git checkout -- . 2>/dev/null || true
          rm -rf temp_dl temp_extracted 2>/dev/null || true
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          git clean -fd

          PUSHED="false"
          for i in {1..5}; do
            echo "[同步] 尝试推送到远程仓库 ($i/5)..."
            if git push origin main; then
              echo "[成功] 数据与 .bak 容灾备份已顺利推送到远程仓库！"
              PUSHED="true"
              break
            fi

            echo "[重试] 推送遇阻（远程有新提交），拉取最新分支进行变基..."
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "[成功] 变基后数据已顺利推送到远程仓库！"
                PUSHED="true"
                break
              fi
            else
              echo "[冲突处理] data/ 与远程存在并发冲突，切换到最新 origin/main 重新增量合入（避免破坏 JSON）..."
              git rebase --abort 2>/dev/null || true
              git reset --hard origin/main
              git clean -fd

              python scripts/daily_monitor.py
              git add data/
              if git diff --staged --quiet; then
                echo "[状态] 远程已包含最新数据，无需重复提交。"
                PUSHED="true"
                break
              fi

              git commit -m "Auto-database: update QQ SubID mapping and watermarks [skip ci]"
              git checkout -- . 2>/dev/null || true
              rm -rf temp_dl temp_extracted 2>/dev/null || true
              find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
              git clean -fd

              if git push origin main; then
                echo "[成功] 重新基于最新分支合入后已顺利推送！"
                PUSHED="true"
                break
              fi
            fi
            sleep 2
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::连续 5 次推送到远程仓库均失败！"
            exit 1
          fi

      # ==========================================
      # 联动步骤：遍历触发本轮所有新增官方 Android 版本的反编译工作流
      # ==========================================
      - name: 自动唤起 Android 反编译与 Diff 工作流
        if: steps.monitor_step.outputs.trigger_decompile == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_TASKS_JSON: ${{ steps.monitor_step.outputs.android_tasks_json }}
          FALLBACK_URL: ${{ steps.monitor_step.outputs.android_apk_url }}
          FALLBACK_VER: ${{ steps.monitor_step.outputs.android_version }}
          FALLBACK_BETA: ${{ steps.monitor_step.outputs.android_is_beta }}
        run: |
          python3 - << 'EOF'
          import json, os, subprocess, time

          raw = os.environ.get("ANDROID_TASKS_JSON", "").strip()
          tasks = []
          if raw:
              try:
                  tasks = json.loads(raw)
              except Exception:
                  tasks = []

          if not tasks and os.environ.get("FALLBACK_URL"):
              tasks = [{
                  "url": os.environ["FALLBACK_URL"],
                  "version": os.environ.get("FALLBACK_VER", ""),
                  "is_beta": os.environ.get("FALLBACK_BETA", "false"),
              }]

          for idx, item in enumerate(tasks, 1):
              print(f"[联动触发 {idx}/{len(tasks)}] 唤醒 decompile 工作流: {item['version']} | Beta={item['is_beta']}")
              subprocess.run([
                  "gh", "workflow", "run", "Auto Decompile & Twinflame DEX Diff QQ APK",
                  "-f", f"apk_url={item['url']}",
                  "-f", f"version_short={item['version']}",
                  "-f", f"is_beta={item['is_beta']}",
                  "-f", "decompile_all=true",
              ], check=True)
              if idx < len(tasks):
                  time.sleep(2)
          EOF
