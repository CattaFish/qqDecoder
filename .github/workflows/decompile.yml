name: Auto Decompile & Twinflame DEX Diff QQ APK

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8:00 (UTC 0:00) 自动执行检测
  workflow_dispatch:
    inputs:
      decompile_all:
        description: '是否完整反编译整个 APK 源码 (产物较大)'
        required: true
        type: boolean
        default: false
      decompile_mobileqq:
        description: '是否反编译 com.tencent.mobileqq'
        required: true
        type: boolean
        default: true
      decompile_qqnt:
        description: '是否反编译 com.tencent.qqnt'
        required: true
        type: boolean
        default: true

jobs:
  decompile-and-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      # ==========================================
      # 1. 检出仓库
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. 自动检测更新队列 (使用原生 Python 脚本)
      # ==========================================
      - name: Check for QQ Update
        id: check_update
        shell: python
        run: |
          import urllib.request
          import re
          import os

          url = "https://t.me/s/qq_updatelog"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
          
          try:
              html = urllib.request.urlopen(req).read().decode('utf-8')
          except Exception as e:
              print(f"Error fetching TG channel: {e}")
              exit(1)

          old_url = ""
          if os.path.exists("latest_version.txt"):
              with open("latest_version.txt", "r", encoding="utf-8") as f:
                  old_url = f.read().strip()

          messages = html.split('class="tgme_widget_message_wrap')
          
          apk_entries = []
          for msg in messages:
              urls = re.findall(r'https://downv6\.qq\.com/qqweb/QQ_1/android_apk/[a-zA-Z0-9_.-]+\.apk', msg)
              if urls:
                  apk_entries.append({'url': urls[-1], 'msg': msg})

          if not apk_entries:
              print("错误: 未能在 Telegram 频道找到任何有效的 APK 下载链接。")
              exit(1)

          pending_entries = []
          if not old_url:
              pending_entries = [apk_entries[-1]]
          else:
              found_old = False
              for item in apk_entries:
                  if item['url'] == old_url:
                      found_old = True
                      continue
                  if found_old:
                      pending_entries.append(item)
              
              if not found_old and apk_entries:
                  pending_entries = [apk_entries[-1]]

          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          has_update = len(pending_entries) > 0 or (event_name == 'workflow_dispatch')

          if not pending_entries and event_name == 'workflow_dispatch':
              pending_entries = [apk_entries[-1]]

          github_output = os.environ.get('GITHUB_OUTPUT')
          if not has_update or not pending_entries:
              print("未检测到新版本，跳过本次处理。")
              with open(github_output, 'a', encoding='utf-8') as f:
                  f.write("has_update=false\n")
                  f.write("has_more=false\n")
              exit(0)

          target_entry = pending_entries[0]
          has_more = len(pending_entries) > 1

          target_url = target_entry['url']
          target_msg = target_entry['msg']

          is_beta = "true" if re.search(r'#beta', target_msg, re.IGNORECASE) else "false"

          ver_match = re.search(r'QQ(?:_NT)?\s+([0-9.]+)', target_msg, re.IGNORECASE)
          if not ver_match:
              ver_match = re.search(r'\b([0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?)\b', target_msg)

          filename = target_url.split('/')[-1].replace('.apk', '')
          version_short = ver_match.group(1) if ver_match else filename.split('_')[0]

          with open(github_output, 'a', encoding='utf-8') as f:
              f.write(f"apk_url={target_url}\n")
              f.write(f"version_short={version_short}\n")
              f.write(f"version_full={filename}\n")
              f.write(f"is_beta={is_beta}\n")
              f.write("has_update=true\n")
              f.write(f"has_more={'true' if has_more else 'false'}\n")

          print(f"本次待处理版本: {version_short}")
          print(f"队列是否还有后续未处理版本: {has_more} (剩余待处理: {len(pending_entries) - 1})")

      # ==========================================
      # 3. 深度清理磁盘并选定工作空间
      # ==========================================
      - name: Free Disk Space & Detect Best Drive
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          echo "正在执行深度磁盘清理..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo rm -rf /mnt/docker 2>/dev/null || true
          
          MNT_AVAIL=$(df -k /mnt 2>/dev/null | tail -n 1 | awk '{print $4}')
          ROOT_AVAIL=$(df -k / 2>/dev/null | tail -n 1 | awk '{print $4}')
          [ -z "$MNT_AVAIL" ] && MNT_AVAIL=0
          [ -z "$ROOT_AVAIL" ] && ROOT_AVAIL=0
          
          if [ "$MNT_AVAIL" -gt "$ROOT_AVAIL" ]; then
            echo "TARGET_DIR=/mnt" >> $GITHUB_ENV
            echo "BEST_AVAIL_KB=${MNT_AVAIL}" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=" >> $GITHUB_ENV
            echo "BEST_AVAIL_KB=${ROOT_AVAIL}" >> $GITHUB_ENV
          fi

      # ==========================================
      # 4. 创建动态自适应 Swap 空间
      # ==========================================
      - name: Create Dynamic Swap Space
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          SWAP_PATH="${{ env.TARGET_DIR }}/swapfile"
          [ -z "${{ env.TARGET_DIR }}" ] && SWAP_PATH="/swapfile"
          
          AVAIL_GB=$(( ${{ env.BEST_AVAIL_KB }} / 1024 / 1024 ))
          CALC_SWAP=$(( AVAIL_GB - 16 ))
          if [ "$CALC_SWAP" -gt 40 ]; then
            ALLOC_SWAP=40
          elif [ "$CALC_SWAP" -lt 16 ]; then
            ALLOC_SWAP=16
          else
            ALLOC_SWAP=$CALC_SWAP
          fi
          
          sudo swapoff -a || true
          sudo fallocate -l "${ALLOC_SWAP}G" $SWAP_PATH
          sudo chmod 600 $SWAP_PATH
          sudo mkswap $SWAP_PATH
          sudo swapon $SWAP_PATH
          free -h

      # ==========================================
      # 5. 配置基础编译与运行环境
      # ==========================================
      - name: Set up Python 3.11
        if: steps.check_update.outputs.has_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        if: steps.check_update.outputs.has_update == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Toolchain
        if: steps.check_update.outputs.has_update == 'true'
        uses: dtolnay/rust-toolchain@stable

      # ==========================================
      # 6. 下载 APK 并提取当前 DEX
      # ==========================================
      - name: Download APK and Extract DEX
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          if [ "${{ env.TARGET_DIR }}" = "/mnt" ]; then
            REAL_WORKSPACE="/mnt/workspace"
            sudo mkdir -p $REAL_WORKSPACE
            sudo chown -R runner:runner $REAL_WORKSPACE
          else
            REAL_WORKSPACE="$GITHUB_WORKSPACE/workspace_real"
            mkdir -p $REAL_WORKSPACE
          fi
          
          rm -rf workspace || true
          ln -sf $REAL_WORKSPACE workspace
          cd workspace
          
          echo "正在下载 APK: ${{ steps.check_update.outputs.apk_url }}"
          curl -L "${{ steps.check_update.outputs.apk_url }}" -o target.apk
          
          mkdir -p new_dex
          unzip -q target.apk "classes*.dex" -d new_dex/
          echo "已提取新版 DEX 数量: $(ls -1 new_dex/*.dex | wc -l)"
          
          zip -q -j dex_archive.zip new_dex/*.dex

      # ==========================================
      # 7. 检测基准版本并准备历史 DEX
      # ==========================================
      - name: Prepare Previous DEX
        id: prepare_prev
        if: steps.check_update.outputs.has_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd workspace
          CURRENT_TAG="v${{ steps.check_update.outputs.version_short }}"
          IS_BETA="${{ steps.check_update.outputs.is_beta }}"

          if [ "$IS_BETA" = "true" ]; then
            echo "当前版本为 Beta 测试版，优先寻找最新正式版作为基准..."
            PREV_TAG=$(gh release list --limit 20 --json tagName,isPrerelease -q '.[] | select(.isPrerelease == false) | .tagName' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG=$(gh release list --limit 10 --json tagName -q '.[].tagName' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
            fi
          else
            echo "当前版本为正式版，寻找上一正式版作为基准..."
            PREV_TAG=$(gh release list --limit 20 --json tagName,isPrerelease -q '.[] | select(.isPrerelease == false) | .tagName' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG=$(gh release list --limit 10 --json tagName -q '.[].tagName' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
            fi
          fi

          echo "当前版本: ${CURRENT_TAG} | 比对基准版本: ${PREV_TAG}"
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

          HAS_PREV_DEX="false"
          if [ -n "$PREV_TAG" ]; then
            mkdir -p prev_download old_dex
            if gh release download "$PREV_TAG" -p "dex_archive.zip" -D prev_download 2>/dev/null; then
              unzip -q prev_download/dex_archive.zip -d old_dex/
              HAS_PREV_DEX="true"
              echo "成功载入旧版 DEX 数量: $(ls -1 old_dex/*.dex 2>/dev/null | wc -l)"
            else
              echo "基准版本没有历史 dex_archive.zip 产物，本次将跳过 Diff。"
            fi
          fi

          echo "has_prev_dex=${HAS_PREV_DEX}" >> $GITHUB_OUTPUT
          if [ "$HAS_PREV_DEX" = "false" ]; then
            echo "- 代码对比: 未检测到基准版本的 DEX 文件，跳过本次比对。" > diff_notes.md
          fi

      # ==========================================
      # 8. 安装 Twinflame 与 Baksmali (仅当存在历史 DEX 时安装)
      # ==========================================
      - name: Install Twinflame & Baksmali
        if: steps.check_update.outputs.has_update == 'true' && steps.prepare_prev.outputs.has_prev_dex == 'true'
        run: |
          git clone https://github.com/ankorio/twinflame.git _tf_src
          pip install maturin
          cd _tf_src/native
          maturin build --release --out dist
          pip install dist/*.whl
          cd ..
          pip install .
          cd ..
          rm -rf _tf_src

          mkdir -p bin
          curl -L -s https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o bin/baksmali.jar || \
          curl -L -s https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar -o bin/baksmali.jar

      # ==========================================
      # 9. 执行 Twinflame 与 Baksmali 反编译比对
      # ==========================================
      - name: Run Twinflame Analysis & Baksmali
        if: steps.check_update.outputs.has_update == 'true' && steps.prepare_prev.outputs.has_prev_dex == 'true'
        run: |
          cd workspace
          echo "阶段一: 压制二进制指纹..."
          twinflame prepare old_dex/ -o old.tfr
          twinflame prepare new_dex/ -o new.tfr

          echo "阶段二: 语义混淆比对..."
          twinflame old.tfr new.tfr \
            --find-obfuscated \
            --skip-external \
            --skip-synthetic \
            -s changed \
            --deobfuscation-map diff_mapping.txt \
            -o report.json

          echo "阶段三: 反编译 Smali..."
          mkdir -p old_smali new_smali
          for f in old_dex/*.dex; do
            [ -f "$f" ] && java -jar "$GITHUB_WORKSPACE/bin/baksmali.jar" d "$f" -o old_smali || true
          done
          for f in new_dex/*.dex; do
            [ -f "$f" ] && java -jar "$GITHUB_WORKSPACE/bin/baksmali.jar" d "$f" -o new_smali || true
          done

      # ==========================================
      # 10. 原生 Python 处理 Smali 差异 (无 Here-Doc 风险)
      # ==========================================
      - name: Process Smali Diff Results
        if: steps.check_update.outputs.has_update == 'true' && steps.prepare_prev.outputs.has_prev_dex == 'true'
        shell: python
        run: |
          import os, json, difflib, shutil, filecmp

          os.chdir("workspace")
          DIR_MODIFIED = 'diff_output/1_MODIFIED'
          DIR_REMOVED  = 'diff_output/2_REMOVED'
          DIR_ADDED    = 'diff_output/3_ADDED'
          os.makedirs(f'{DIR_MODIFIED}/classes', exist_ok=True)
          os.makedirs(f'{DIR_REMOVED}/classes', exist_ok=True)
          os.makedirs(f'{DIR_ADDED}/classes', exist_ok=True)
          os.makedirs('changed_smali/old', exist_ok=True)
          os.makedirs('changed_smali/new', exist_ok=True)

          IGNORED_PREFIXES = (
              'android/', 'androidx/', 'kotlin/', 'kotlinx/',
              'okhttp3/', 'okio/', 'com/squareup/okhttp/',
              'com/google/android/', 'org/apache/', 'org/jetbrains/',
          )

          def is_ignored(rel_path):
              return rel_path.startswith(IGNORED_PREFIXES)

          print("正在扫描磁盘真实 smali 文件...")
          old_files = {}
          for root, _, files in os.walk('old_smali'):
              for file in files:
                  if file.endswith('.smali'):
                      full = os.path.join(root, file)
                      rel = os.path.relpath(full, 'old_smali').replace('\\', '/')
                      if not is_ignored(rel):
                          old_files[rel] = full

          new_files = {}
          for root, _, files in os.walk('new_smali'):
              for file in files:
                  if file.endswith('.smali'):
                      full = os.path.join(root, file)
                      rel = os.path.relpath(full, 'new_smali').replace('\\', '/')
                      if not is_ignored(rel):
                          new_files[rel] = full

          modified_diffs = []
          removed_diffs = []
          added_diffs = []

          common_files = set(old_files.keys()) & set(new_files.keys())
          print(f"双方同名业务类共 {len(common_files)} 个，开始逐行校验...")

          for rel in common_files:
              old_p = old_files[rel]
              new_p = new_files[rel]

              if filecmp.cmp(old_p, new_p, shallow=False):
                  continue

              with open(old_p, 'r', encoding='utf-8', errors='ignore') as f1, \
                   open(new_p, 'r', encoding='utf-8', errors='ignore') as f2:
                  old_lines = f1.readlines()
                  new_lines = f2.readlines()

              diff = list(difflib.unified_diff(
                  old_lines, new_lines,
                  fromfile=f"old/{rel}", tofile=f"new/{rel}", n=3
              ))
              if diff:
                  diff_text = "".join(diff)
                  safe_name = rel.replace('/', '.').replace('.smali', '')
                  with open(f"{DIR_MODIFIED}/classes/{safe_name}.diff", 'w', encoding='utf-8') as out:
                      out.write(diff_text)
                  modified_diffs.append(diff_text)

                  dest_old = os.path.join('changed_smali/old', rel)
                  dest_new = os.path.join('changed_smali/new', rel)
                  os.makedirs(os.path.dirname(dest_old), exist_ok=True)
                  os.makedirs(os.path.dirname(dest_new), exist_ok=True)
                  shutil.copyfile(old_p, dest_old)
                  shutil.copyfile(new_p, dest_new)

          only_old = set(old_files.keys()) - common_files
          only_new = set(new_files.keys()) - common_files

          rename_map = {}
          if os.path.exists('report.json'):
              with open('report.json', 'r', encoding='utf-8') as f:
                  report = json.load(f)
              for item in report.get('changes', []):
                  if item.get('kind') == 'modified' and item.get('lhs') and item.get('rhs'):
                      l_rel = item['lhs'].strip()[1:-1] + '.smali'
                      r_rel = item['rhs'].strip()[1:-1] + '.smali'
                      if l_rel in only_old and r_rel in only_new:
                          rename_map[l_rel] = r_rel

          for l_rel, r_rel in list(rename_map.items()):
              if l_rel not in only_old or r_rel not in only_new:
                  continue
              old_p = old_files[l_rel]
              new_p = new_files[r_rel]
              with open(old_p, 'r', encoding='utf-8', errors='ignore') as f1, \
                   open(new_p, 'r', encoding='utf-8', errors='ignore') as f2:
                  diff = list(difflib.unified_diff(
                      f1.readlines(), f2.readlines(),
                      fromfile=f"old/{l_rel} (renamed)", tofile=f"new/{r_rel}", n=3
                  ))
              if diff:
                  diff_text = "".join(diff)
                  safe_name = f"RENAMED_{r_rel.replace('/', '.').replace('.smali', '')}"
                  with open(f"{DIR_MODIFIED}/classes/{safe_name}.diff", 'w', encoding='utf-8') as out:
                      out.write(diff_text)
                  modified_diffs.append(diff_text)
              only_old.discard(l_rel)
              only_new.discard(r_rel)

          for rel in only_old:
              old_p = old_files[rel]
              with open(old_p, 'r', encoding='utf-8', errors='ignore') as f:
                  diff = list(difflib.unified_diff(
                      f.readlines(), [],
                      fromfile=f"old/{rel}", tofile="/dev/null", n=3
                  ))
              if diff:
                  diff_text = "".join(diff)
                  safe_name = rel.replace('/', '.').replace('.smali', '')
                  with open(f"{DIR_REMOVED}/classes/{safe_name}.diff", 'w', encoding='utf-8') as out:
                      out.write(diff_text)
                  removed_diffs.append(diff_text)

          for rel in only_new:
              new_p = new_files[rel]
              with open(new_p, 'r', encoding='utf-8', errors='ignore') as f:
                  diff = list(difflib.unified_diff(
                      [], f.readlines(),
                      fromfile="/dev/null", tofile=f"new/{rel}", n=3
                  ))
              if diff:
                  diff_text = "".join(diff)
                  safe_name = rel.replace('/', '.').replace('.smali', '')
                  with open(f"{DIR_ADDED}/classes/{safe_name}.diff", 'w', encoding='utf-8') as out:
                      out.write(diff_text)
                  added_diffs.append(diff_text)

          with open(f"{DIR_MODIFIED}/all_modified.diff", 'w', encoding='utf-8') as f:
              f.write("\n".join(modified_diffs))
          with open(f"{DIR_REMOVED}/all_removed.diff", 'w', encoding='utf-8') as f:
              f.write("\n".join(removed_diffs))
          with open(f"{DIR_ADDED}/all_added.diff", 'w', encoding='utf-8') as f:
              f.write("\n".join(added_diffs))

          print(f"最终精炼结果: 真正修改类 {len(modified_diffs)} 个，彻底删除 {len(removed_diffs)} 个，纯新增 {len(added_diffs)} 个")

      # ==========================================
      # 11. 打包 Diff 产物并输出报告
      # ==========================================
      - name: Package Diff Output
        if: steps.check_update.outputs.has_update == 'true' && steps.prepare_prev.outputs.has_prev_dex == 'true'
        run: |
          cd workspace
          zip -q -r diff_output.zip diff_output/ changed_smali/
          
          MOD_COUNT=$(ls -1 diff_output/1_MODIFIED/classes/*.diff 2>/dev/null | wc -l)
          REM_COUNT=$(ls -1 diff_output/2_REMOVED/classes/*.diff 2>/dev/null | wc -l)
          ADD_COUNT=$(ls -1 diff_output/3_ADDED/classes/*.diff 2>/dev/null | wc -l)
          
          {
            echo ""
            echo "### Twinflame DEX 语义精准 Diff 变更汇总"
            echo "- 对比基准版本: \`${{ steps.prepare_prev.outputs.prev_tag }}\`"
            echo "- 核心修改业务类 (Modified): \`${MOD_COUNT}\` 个"
            echo "- 彻底废弃/删除类 (Removed): \`${REM_COUNT}\` 个"
            echo "- 纯新增业务类 (Added): \`${ADD_COUNT}\` 个"
            echo "- 详细产物: 见附件 \`diff_output.zip\`、\`diff_mapping.txt\` 及 \`report.json\`。"
            echo ""
          } > diff_notes.md
          
          cat diff_notes.md >> $GITHUB_STEP_SUMMARY
          rm -rf old_dex old_smali new_smali prev_download

      # ==========================================
      # 12. 安装 JADX 并反编译源码
      # ==========================================
      - name: Install JADX and Decompile Java Source
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          mkdir -p bin
          JADX_VERSION=$(curl -s https://api.github.com/repos/skylot/jadx/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -L "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip" -o jadx.zip
          unzip -d bin/jadx jadx.zip
          chmod -R +x bin/jadx/bin
          
          cd workspace
          mkdir -p java_final
          
          FILTER=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.decompile_all }}" = "false" ]; then
            if [ "${{ inputs.decompile_mobileqq }}" = "true" ] && [ "${{ inputs.decompile_qqnt }}" = "true" ]; then
              FILTER="com.tencent.mobileqq,com.tencent.qqnt"
            elif [ "${{ inputs.decompile_mobileqq }}" = "true" ]; then
              FILTER="com.tencent.mobileqq"
            elif [ "${{ inputs.decompile_qqnt }}" = "true" ]; then
              FILTER="com.tencent.qqnt"
            fi
          fi
          
          export JAVA_OPTS="-Xmx28g"
          set +e
          if [ -n "$FILTER" ]; then
            echo "局部反编译包: $FILTER"
            "$GITHUB_WORKSPACE/bin/jadx/bin/jadx" -d java_final --no-res --threads-count 2 --no-debug-info --show-only "$FILTER" new_dex/*.dex
          else
            echo "完整反编译中..."
            "$GITHUB_WORKSPACE/bin/jadx/bin/jadx" -d java_final --no-res --threads-count 2 new_dex/*.dex
          fi
          EXIT_CODE=$?
          set -e

          if [ -d "java_final" ] && [ "$(ls -A java_final)" ]; then
            mv java_final decompiled_java
            zip -q -r java_output.zip decompiled_java
          else
            mkdir -p decompiled_java
            echo "未提取到指定 Java 代码。" > decompiled_java/readme.txt
            zip -q -r java_output.zip decompiled_java
          fi
          rm -rf new_dex target.apk

      # ==========================================
      # 13. 创建 GitHub Release
      # ==========================================
      - name: Create GitHub Release
        if: steps.check_update.outputs.has_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd workspace
          VERSION_SHORT="${{ steps.check_update.outputs.version_short }}"
          VERSION_FULL="${{ steps.check_update.outputs.version_full }}"
          APK_URL="${{ steps.check_update.outputs.apk_url }}"
          IS_BETA="${{ steps.check_update.outputs.is_beta }}"
          
          RELEASE_TITLE="QQ Android v${VERSION_SHORT}"
          EXTRA_FLAGS=""
          BETA_NOTE=""

          if [ "$IS_BETA" = "true" ]; then
            RELEASE_TITLE="QQ Android v${VERSION_SHORT} [Beta]"
            EXTRA_FLAGS="--prerelease"
            BETA_NOTE="> 当前版本被标记为 #Beta 测试版"
          fi

          ASSETS="java_output.zip dex_archive.zip"
          [ -f "diff_output.zip" ] && ASSETS="${ASSETS} diff_output.zip"
          [ -f "diff_mapping.txt" ] && ASSETS="${ASSETS} diff_mapping.txt"
          [ -f "report.json" ] && ASSETS="${ASSETS} report.json"

          {
            if [ -n "$BETA_NOTE" ]; then
              echo "$BETA_NOTE"
              echo ""
            fi
            echo "### QQ Android 自动分析产物说明"
            echo ""
            echo "- 应用版本: \`${VERSION_SHORT}\`"
            echo "- 安装包文件名: \`${VERSION_FULL}.apk\`"
            echo "- 测试版状态: \`${IS_BETA}\`"
            echo "- 官方下载直链: [点击从腾讯官方下载](${APK_URL})"
            echo "- 生成时间: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S') (北京时间)"
            echo ""
            if [ -f "diff_notes.md" ]; then
              cat diff_notes.md
            fi
          } > release_notes.md

          echo "发布 Release: ${RELEASE_TITLE}"
          gh release create "v${VERSION_SHORT}" ${ASSETS} \
            --title "${RELEASE_TITLE}" \
            ${EXTRA_FLAGS} \
            --notes-file release_notes.md || \
          gh release upload "v${VERSION_SHORT}" ${ASSETS} --clobber

      # ==========================================
      # 14. 更新版本记录与多版本轮询
      # ==========================================
      - name: Commit and Push Version Update
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          echo "${{ steps.check_update.outputs.apk_url }}" > latest_version.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_version.txt
          git commit -m "Auto-update QQ APK record: ${{ steps.check_update.outputs.version_short }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push

      - name: Trigger Next Run If More Versions Pending
        if: steps.check_update.outputs.has_more == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检测到队列中还有未处理的版本，触发下一次工作流..."
          gh workflow run "Auto Decompile & Twinflame DEX Diff QQ APK"
