name: Auto Decompile & Twinflame DEX Diff QQ APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: '指定待反编译的 APK 下载链接 (留空则自动检测最新版)'
        required: false
        type: string
        default: ''
      version_short:
        description: '指定版本号 (例如 9.3.75，留空则自动提取)'
        required: false
        type: string
        default: ''
      is_beta:
        description: '是否标记为测试版'
        required: false
        type: boolean
        default: false
      decompile_all:
        description: '是否完整反编译整个 APK 源码 (全量)'
        required: false
        type: boolean
        default: true
      decompile_mobileqq:
        description: '是否反编译 com.tencent.mobileqq (仅在非全量时有效)'
        required: false
        type: boolean
        default: true
      decompile_qqnt:
        description: '是否反编译 com.tencent.qqnt (仅在非全量时有效)'
        required: false
        type: boolean
        default: true

jobs:
  decompile-and-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      # ==========================================
      # 1. 检出仓库
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. 自动检测更新队列 / 接收外部联动参数
      # ==========================================
      - name: Check for QQ Update
        id: check_update
        shell: python
        run: |
          import urllib.request
          import re
          import os

          input_apk_url = "${{ inputs.apk_url }}".strip()
          input_ver = "${{ inputs.version_short }}".strip()
          input_beta = "${{ inputs.is_beta }}".strip().lower()
          github_output = os.environ.get('GITHUB_OUTPUT')

          # 容错拦截：若外部传入了 TG 备份链接，自动在频道页面中反查官方直链
          if input_apk_url and "t.me/" in input_apk_url:
              print(f"[直链纠偏] 外部传入了 Telegram 备份链接 ({input_apk_url})，正在尝试反查官方直链...")
              try:
                  ch_req = urllib.request.Request(
                      "https://t.me/s/qq_updatelog",
                      headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
                  )
                  ch_html = urllib.request.urlopen(ch_req, timeout=20).read().decode('utf-8')
                  blocks = ch_html.split('class="tgme_widget_message_wrap')
                  for b in reversed(blocks):
                      if input_apk_url in b or input_apk_url.split('/')[-1] in b:
                          m_cands = re.findall(r'href="(https?://[a-zA-Z0-9_.-]*(?:qq\.com|myapp\.com)[^"]+\.apk[^"]*)"', b)
                          if m_cands:
                              input_apk_url = m_cands[0]
                              print(f"[直链纠偏] 成功替换为官方直链: {input_apk_url}")
                              break
              except Exception as e:
                  print(f"[直链纠偏异常] {e}")

          if input_apk_url:
              print(f"[任务确认] 目标 APK 下载链接: {input_apk_url}")
              fname = input_apk_url.split('?')[0].split('/')[-1].replace('.apk', '')
              v_short = input_ver or fname.split('_')[0]
              with open(github_output, 'a', encoding='utf-8') as f:
                  f.write(f"apk_url={input_apk_url}\n")
                  f.write(f"version_short={v_short}\n")
                  f.write(f"version_full={fname}\n")
                  f.write(f"is_beta={input_beta}\n")
                  f.write("has_update=true\n")
                  f.write("has_more=false\n")
              exit(0)

          # 若无外部参数，自主扫描 TG 频道
          url = "https://t.me/s/qq_updatelog"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
          
          try:
              html = urllib.request.urlopen(req, timeout=30).read().decode('utf-8')
          except Exception as e:
              print(f"Error fetching TG channel: {e}")
              exit(1)

          old_url = ""
          if os.path.exists("latest_version.txt"):
              with open("latest_version.txt", "r", encoding="utf-8") as f:
                  old_url = f.read().strip()

          messages = html.split('class="tgme_widget_message_wrap')
          
          apk_entries = []
          for msg in messages:
              direct_url = None
              cand_hrefs = re.findall(r'href="(https?://[^"]+\.apk[^"]*)"', msg)
              for h in cand_hrefs:
                  if "t.me/" not in h and any(k in h for k in ["qq.com", "myapp.com"]):
                      direct_url = h
                      break
              
              if not direct_url:
                  urls = re.findall(r'https?://[a-zA-Z0-9_.-]*(?:qq\.com|myapp\.com)[^"\';\s<>]+\.apk[^"\';\s<>]*', msg)
                  if urls:
                      direct_url = urls[-1]

              if direct_url:
                  apk_entries.append({'url': direct_url, 'msg': msg})

          if not apk_entries:
              print("错误: 未能在 Telegram 频道找到任何有效的官方 APK 下载直链。")
              exit(1)

          pending_entries = []
          if not old_url:
              pending_entries = [apk_entries[-1]]
          else:
              found_old = False
              for item in apk_entries:
                  if item['url'] == old_url:
                      found_old = True
                      continue
                  if found_old:
                      pending_entries.append(item)
              
              if not found_old and apk_entries:
                  pending_entries = [apk_entries[-1]]

          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          has_update = len(pending_entries) > 0 or (event_name == 'workflow_dispatch')

          if not pending_entries and event_name == 'workflow_dispatch':
              pending_entries = [apk_entries[-1]]

          if not has_update or not pending_entries:
              print("未检测到新版本，跳过本次处理。")
              with open(github_output, 'a', encoding='utf-8') as f:
                  f.write("has_update=false\n")
                  f.write("has_more=false\n")
              exit(0)

          target_entry = pending_entries[0]
          has_more = len(pending_entries) > 1

          target_url = target_entry['url']
          target_msg = target_entry['msg']

          is_beta = "true" if re.search(r'#beta', target_msg, re.IGNORECASE) else "false"

          ver_match = re.search(r'QQ(?:_NT)?\s+([0-9.]+)', target_msg, re.IGNORECASE)
          if not ver_match:
              ver_match = re.search(r'\b([0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?)\b', target_msg)

          filename = target_url.split('?')[0].split('/')[-1].replace('.apk', '')
          version_short = ver_match.group(1) if ver_match else filename.split('_')[0]

          with open(github_output, 'a', encoding='utf-8') as f:
              f.write(f"apk_url={target_url}\n")
              f.write(f"version_short={version_short}\n")
              f.write(f"version_full={filename}\n")
              f.write(f"is_beta={is_beta}\n")
              f.write("has_update=true\n")
              f.write(f"has_more={'true' if has_more else 'false'}\n")

      # ==========================================
      # 3. 深度清理磁盘并选定最佳分区
      # ==========================================
      - name: Free Disk Space & Detect Best Drive
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo rm -rf /mnt/docker 2>/dev/null || true
          
          MNT_AVAIL=$(df -k /mnt 2>/dev/null | tail -n 1 | awk '{print $4}')
          ROOT_AVAIL=$(df -k / 2>/dev/null | tail -n 1 | awk '{print $4}')
          [ -z "$MNT_AVAIL" ] && MNT_AVAIL=0
          [ -z "$ROOT_AVAIL" ] && ROOT_AVAIL=0
          
          if [ "$MNT_AVAIL" -gt "$ROOT_AVAIL" ]; then
            echo "TARGET_DIR=/mnt" >> $GITHUB_ENV
            echo "BEST_AVAIL_KB=${MNT_AVAIL}" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=" >> $GITHUB_ENV
            echo "BEST_AVAIL_KB=${ROOT_AVAIL}" >> $GITHUB_ENV
          fi

      # ==========================================
      # 4. 创建最高 64GB 动态自适应 Swap 空间
      # ==========================================
      - name: Create Dynamic Swap Space
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          SWAP_PATH="${{ env.TARGET_DIR }}/swapfile"
          [ -z "${{ env.TARGET_DIR }}" ] && SWAP_PATH="/swapfile"
          
          AVAIL_GB=$(( ${{ env.BEST_AVAIL_KB }} / 1024 / 1024 ))
          # 保留 16GB 物理磁盘作为基本写盘安全垫，其余尽可能全部拉满 Swap，最高到 64GB
          CALC_SWAP=$(( AVAIL_GB - 16 ))
          if [ "$CALC_SWAP" -gt 64 ]; then
            ALLOC_SWAP=64
          elif [ "$CALC_SWAP" -lt 16 ]; then
            ALLOC_SWAP=16
          else
            ALLOC_SWAP=$CALC_SWAP
          fi
          
          echo "根据当前分区容量 ($AVAIL_GB GB)，动态开辟 Swap 虚拟内存: ${ALLOC_SWAP}GB"
          sudo swapoff -a || true
          sudo fallocate -l "${ALLOC_SWAP}G" $SWAP_PATH
          sudo chmod 600 $SWAP_PATH
          sudo mkswap $SWAP_PATH
          sudo swapon $SWAP_PATH
          free -h

      # ==========================================
      # 5. 配置基础编译与运行环境
      # ==========================================
      - name: Set up Python 3.11
        if: steps.check_update.outputs.has_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        if: steps.check_update.outputs.has_update == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust Toolchain
        if: steps.check_update.outputs.has_update == 'true'
        uses: dtolnay/rust-toolchain@stable

      # ==========================================
      # 安装 tdl 客户端并恢复会话
      # ==========================================
      - name: Setup tdl Client & Telegram Session
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          curl -sSL https://docs.iyear.me/tdl/install.sh | sudo bash
          if [ -n "${{ secrets.TDL_SESSION_BASE64 }}" ]; then
            echo "${{ secrets.TDL_SESSION_BASE64 }}" | base64 -d > tg_backup.zip
            tdl recover -f tg_backup.zip || true
            rm -f tg_backup.zip
          fi

      # ==========================================
      # 6. 下载 APK 并提取当前 DEX
      # ==========================================
      - name: Download APK and Extract DEX
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          if [ "${{ env.TARGET_DIR }}" = "/mnt" ]; then
            REAL_WORKSPACE="/mnt/workspace"
            sudo mkdir -p $REAL_WORKSPACE
            sudo chown -R runner:runner $REAL_WORKSPACE
          else
            REAL_WORKSPACE="$GITHUB_WORKSPACE/workspace_real"
            mkdir -p $REAL_WORKSPACE
          fi
          
          rm -rf workspace || true
          ln -sf $REAL_WORKSPACE workspace
          cd workspace
          
          TARGET_URL="${{ steps.check_update.outputs.apk_url }}"
          echo "正在下载 APK: ${TARGET_URL}"
          
          if [[ "$TARGET_URL" =~ t\.me/ ]]; then
            echo "[下载协议] 识别为 Telegram 备份直链，使用 tdl 下载..."
            tdl dl -u "$TARGET_URL" -d .
            DL_FILE=$(find . -maxdepth 1 -name "*.apk" | head -n 1)
            if [ -n "$DL_FILE" ] && [ "$DL_FILE" != "./target.apk" ]; then
              mv "$DL_FILE" target.apk
            fi
          else
            echo "[下载协议] 识别为标准 HTTP 直连，使用 curl 下载..."
            curl -L "$TARGET_URL" -o target.apk
          fi
          
          if [ ! -s target.apk ]; then
            echo "::error::未能成功下载 APK 安装包！"
            exit 1
          fi
          
          mkdir -p new_dex
          unzip -q target.apk "classes*.dex" -d new_dex/
          echo "已提取新版 DEX 数量: $(ls -1 new_dex/*.dex | wc -l)"
          
          zip -q -j dex_archive.zip new_dex/*.dex

      # ==========================================
      # 7. 提取 SubID 及版本元数据
      # ==========================================
      - name: Extract SubID and Metadata
        if: steps.check_update.outputs.has_update == 'true'
        shell: python
        run: |
          import os, zipfile, struct

          os.chdir("workspace")
          apk_path = "target.apk"

          def get_axml_strings(data):
              if len(data) < 36: return []
              chunk_type, chunk_size, string_count, style_count, flags, strings_start, styles_start = struct.unpack_from('<IIIIIII', data, 8)
              if chunk_type != 0x001C0001: return []
              is_utf8 = bool(flags & 0x100)
              offsets = [struct.unpack_from('<I', data, 36 + i * 4)[0] for i in range(string_count)]
              base = 8 + strings_start
              strings = []
              for off in offsets:
                  pos = base + off
                  if is_utf8:
                      while pos < len(data) and (data[pos] & 0x80): pos += 1
                      pos += 1
                      while pos < len(data) and (data[pos] & 0x80): pos += 1
                      pos += 1
                      end = data.find(b'\x00', pos)
                      strings.append(data[pos:end].decode('utf-8', errors='ignore') if end != -1 else "")
                  else:
                      length = struct.unpack_from('<H', data, pos)[0]
                      pos += 2
                      if length & 0x8000: pos += 2
                      s_bytes = data[pos : pos + length * 2]
                      strings.append(s_bytes.decode('utf-16le', errors='ignore'))
              return strings

          def parse_metadata_params(data):
              strings = get_axml_strings(data)
              params = {}
              try:
                  pos = 8 + struct.unpack_from('<I', data, 12)[0]
                  while pos < len(data):
                      if pos + 8 > len(data): break
                      c_type, c_header_size, c_size = struct.unpack_from('<HHI', data, pos)
                      if c_type == 0x0102:
                          _, name_idx, attr_start, attr_size, attr_count = struct.unpack_from('<IIHHH', data, pos + 16)
                          elem_name = strings[name_idx] if name_idx < len(strings) else ""
                          if elem_name == "meta-data":
                              attr_base = pos + attr_start
                              k, v = None, None
                              for i in range(attr_count):
                                  a_pos = attr_base + i * attr_size
                                  _, a_name, a_val_str, _, a_data = struct.unpack_from('<IIIHI', data, a_pos)
                                  name_str = strings[a_name] if a_name < len(strings) else ""
                                  val_str = strings[a_val_str] if a_val_str < len(strings) and a_val_str != 0xFFFFFFFF else str(a_data)
                                  if name_str == "name": k = val_str
                                  elif name_str == "value": v = val_str
                              if k in ("AppSetting_params", "AppSetting_params_pad") and v:
                                  params[k] = v
                      pos += c_size
                      if c_size <= 0: break
              except Exception:
                  pass

              if "AppSetting_params" not in params or "AppSetting_params_pad" not in params:
                  for s in strings:
                      if "#" in s:
                          pts = s.split("#")
                          if len(pts) >= 4 and pts[0].isdigit() and len(pts[0]) in (9, 10):
                              if "AppSetting_params" not in params:
                                  params["AppSetting_params"] = s
                              elif "AppSetting_params_pad" not in params and s != params.get("AppSetting_params"):
                                  params["AppSetting_params_pad"] = s
              return params

          with zipfile.ZipFile(apk_path, 'r') as zf:
              manifest_data = zf.read("AndroidManifest.xml")

          meta = parse_metadata_params(manifest_data)
          phone_raw = meta.get("AppSetting_params", "")
          pad_raw = meta.get("AppSetting_params_pad", "")

          def parse_item(raw_str):
              if not raw_str: return {}
              p = raw_str.split("#")
              subid = int(p[0]) if len(p) > 0 and p[0].isdigit() else 0
              return {
                  "subid": subid,
                  "subid_hex": f"0x{subid:08x}" if subid else "",
                  "cert_hash": p[1] if len(p) > 1 else "",
                  "channel_id": p[2] if len(p) > 2 else "",
                  "channel_name": p[3] if len(p) > 3 else ""
              }

          phone_info = parse_item(phone_raw)
          pad_info = parse_item(pad_raw)

          notes = [
              "### 客户端版本识别码 (SubID)",
              f"- 手机端 SubID: `{phone_info.get('subid', '未知')}` (`{phone_info.get('subid_hex', '')}`)",
              f"- 平板端 SubID: `{pad_info.get('subid', '未知')}` (`{pad_info.get('subid_hex', '')}`)",
              f"- 官方渠道: `{phone_info.get('channel_name', '未知')}` (ID: `{phone_info.get('channel_id', '未知')}`)",
              f"- 校验特征: `{phone_info.get('cert_hash', '未知')}`",
              ""
          ]
          with open("subid_notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(notes))

          print("[OK] SubID 提取完毕:")
          print(f"  手机端: {phone_info.get('subid')} ({phone_info.get('subid_hex')})")
          print(f"  平板端: {pad_info.get('subid')} ({pad_info.get('subid_hex')})")

      # ==========================================
      # 8. 检测基准版本并准备历史 DEX
      # ==========================================
      - name: Prepare Previous DEX
        id: prepare_prev
        if: steps.check_update.outputs.has_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd workspace
          CURRENT_TAG="v${{ steps.check_update.outputs.version_short }}"
          IS_BETA="${{ steps.check_update.outputs.is_beta }}"

          if [ "$IS_BETA" = "true" ]; then
            echo "当前版本为 Beta 测试版，优先寻找最新正式版作为基准..."
            PREV_TAG=$(gh release list --limit 20 --json tagName,isPrerelease -q '.[] | select(.isPrerelease == false) | .tagName' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG=$(gh release list --limit 10 --json tagName -q '.[].tagName' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
            fi
          else
            echo "当前版本为正式版，寻找上一正式版作为基准..."
            PREV_TAG=$(gh release list --limit 20 --json tagName,isPrerelease -q '.[] | select(.isPrerelease == false) | .tagName' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
            if [ -z "$PREV_TAG" ]; then
              PREV_TAG=$(gh release list --limit 10 --json tagName -q '.[].tagName' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
            fi
          fi

          echo "当前版本: ${CURRENT_TAG} | 比对基准版本: ${PREV_TAG}"
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

          HAS_PREV_DEX="false"
          if [ -n "$PREV_TAG" ]; then
            mkdir -p prev_download old_dex
            if gh release download "$PREV_TAG" -p "dex_archive.zip" -D prev_download 2>/dev/null; then
              unzip -q prev_download/dex_archive.zip -d old_dex/
              HAS_PREV_DEX="true"
              echo "成功载入旧版 DEX 数量: $(ls -1 old_dex/*.dex 2>/dev/null | wc -l)"
            else
              echo "基准版本没有历史 dex_archive.zip 产物，本次将跳过 Diff。"
            fi
          fi

          echo "has_prev_dex=${HAS_PREV_DEX}" >> $GITHUB_OUTPUT
          if [ "$HAS_PREV_DEX" = "false" ]; then
            echo "- 代码对比: 未检测到基准版本的 DEX 文件，跳过本次比对。" > diff_notes.md
          fi

      # ==========================================
      # 9. 安装 Twinflame (指向 CattaFish fork) 与 Baksmali
      # ==========================================
      - name: Install Twinflame & Baksmali
        if: steps.check_update.outputs.has_update == 'true' && steps.prepare_prev.outputs.has_prev_dex == 'true'
        run: |
          git clone --depth 1 https://github.com/CattaFish/twinflame.git _tf_src
          pip install maturin
          cd _tf_src/native
          maturin build --release --out dist
          pip install dist/*.whl
          cd ..
          pip install .
          cd ..
          rm -rf _tf_src

          mkdir -p bin
          curl -L -s https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat-release.jar -o bin/baksmali.jar || \
          curl -L -s https://bitbucket.org/JesusFreke/smali/downloads/baksmali-2.5.2.jar -o bin/baksmali.jar

      # ==========================================
      # 10. 执行 Twinflame 与 Baksmali 反编译
      # ==========================================
      - name: Run Twinflame Analysis & Baksmali
        if: steps.check_update.outputs.has_update == 'true' && steps.prepare_prev.outputs.has_prev_dex == 'true'
        run: |
          cd workspace
          echo "阶段一: 压制二进制指纹..."
          twinflame prepare old_dex/ -o old.tfr
          twinflame prepare new_dex/ -o new.tfr

          echo "阶段二: 结构语义混淆全量比对 (优化版 Twinflame)..."
          twinflame old.tfr new.tfr \
            --find-obfuscated \
            --skip-external \
            --skip-synthetic \
            -s changed \
            --deobfuscation-map diff_mapping.txt \
            -o report.json

          echo "阶段三: 反编译 Smali..."
          mkdir -p old_smali new_smali
          BAKSMALI_BIN="$GITHUB_WORKSPACE/bin/baksmali.jar"
          JAVA_CMD="java -Xms256m -Xmx1536m -XX:+UseParallelGC -jar $BAKSMALI_BIN"
          THREADS=$(nproc || echo 4)

          for f in old_dex/*.dex; do
            [ -f "$f" ] && $JAVA_CMD d -j "$THREADS" "$f" -o old_smali || true
          done
          for f in new_dex/*.dex; do
            [ -f "$f" ] && $JAVA_CMD d -j "$THREADS" "$f" -o new_smali || true
          done

      # ==========================================
      # 11. 原生 Python 处理 Smali 差异
      # ==========================================
      - name: Process Smali Diff Results
        if: steps.check_update.outputs.has_update == 'true' && steps.prepare_prev.outputs.has_prev_dex == 'true'
        shell: python
        run: |
          import os, json, difflib, shutil

          os.chdir("workspace")
          DIR_MODIFIED = 'diff_output/1_MODIFIED'
          DIR_REMOVED  = 'diff_output/2_REMOVED'
          DIR_ADDED    = 'diff_output/3_ADDED'
          os.makedirs(f'{DIR_MODIFIED}/classes', exist_ok=True)
          os.makedirs(f'{DIR_REMOVED}/classes', exist_ok=True)
          os.makedirs(f'{DIR_ADDED}/classes', exist_ok=True)
          os.makedirs('changed_smali/old', exist_ok=True)
          os.makedirs('changed_smali/new', exist_ok=True)

          IGNORED_PREFIXES = (
              'android/', 'androidx/', 'kotlin/', 'kotlinx/',
              'okhttp3/', 'okio/', 'com/squareup/okhttp/',
              'com/google/android/', 'org/apache/', 'org/jetbrains/',
          )

          def is_ignored(rel_path):
              return rel_path.startswith(IGNORED_PREFIXES)

          print("正在扫描磁盘真实 smali 文件...")
          old_files = {}
          for root, _, files in os.walk('old_smali'):
              for file in files:
                  if file.endswith('.smali'):
                      full = os.path.join(root, file)
                      rel = os.path.relpath(full, 'old_smali').replace('\\', '/')
                      if not is_ignored(rel):
                          old_files[rel] = full

          new_files = {}
          for root, _, files in os.walk('new_smali'):
              for file in files:
                  if file.endswith('.smali'):
                      full = os.path.join(root, file)
                      rel = os.path.relpath(full, 'new_smali').replace('\\', '/')
                      if not is_ignored(rel):
                          new_files[rel] = full

          common_files = set(old_files.keys()) & set(new_files.keys())
          print(f"双方待对比同名类: {len(common_files)} 个")

          mod_count = 0
          rem_count = 0
          add_count = 0

          with open(f"{DIR_MODIFIED}/all_modified.diff", 'w', encoding='utf-8') as f_all_mod, \
               open(f"{DIR_REMOVED}/all_removed.diff", 'w', encoding='utf-8') as f_all_rem, \
               open(f"{DIR_ADDED}/all_added.diff", 'w', encoding='utf-8') as f_all_add:

              for rel in common_files:
                  old_p = old_files[rel]
                  new_p = new_files[rel]

                  s_old = os.path.getsize(old_p)
                  s_new = os.path.getsize(new_p)
                  if s_old == s_new:
                      with open(old_p, 'rb') as f1, open(new_p, 'rb') as f2:
                          if f1.read() == f2.read():
                              continue

                  with open(old_p, 'r', encoding='utf-8', errors='ignore') as f1, \
                       open(new_p, 'r', encoding='utf-8', errors='ignore') as f2:
                      old_lines = f1.readlines()
                      new_lines = f2.readlines()

                  diff = list(difflib.unified_diff(
                      old_lines, new_lines,
                      fromfile=f"old/{rel}", tofile=f"new/{rel}", n=3
                  ))
                  if diff:
                      diff_text = "".join(diff)
                      safe_name = rel.replace('/', '.').replace('.smali', '')
                      with open(f"{DIR_MODIFIED}/classes/{safe_name}.diff", 'w', encoding='utf-8') as out:
                          out.write(diff_text)
                      f_all_mod.write(diff_text + "\n")
                      mod_count += 1

                      dest_old = os.path.join('changed_smali/old', rel)
                      dest_new = os.path.join('changed_smali/new', rel)
                      os.makedirs(os.path.dirname(dest_old), exist_ok=True)
                      os.makedirs(os.path.dirname(dest_new), exist_ok=True)
                      shutil.copyfile(old_p, dest_old)
                      shutil.copyfile(new_p, dest_new)

              only_old = set(old_files.keys()) - common_files
              only_new = set(new_files.keys()) - common_files

              rename_map = {}
              if os.path.exists('report.json'):
                  try:
                      with open('report.json', 'r', encoding='utf-8') as f:
                          report = json.load(f)
                      for item in report.get('changes', []):
                          if item.get('kind') == 'modified' and item.get('lhs') and item.get('rhs'):
                              l_rel = item['lhs'].strip()[1:-1] + '.smali'
                              r_rel = item['rhs'].strip()[1:-1] + '.smali'
                              if l_rel in only_old and r_rel in only_new:
                                  rename_map[l_rel] = r_rel
                  except Exception:
                      pass

              for l_rel, r_rel in list(rename_map.items()):
                  if l_rel not in only_old or r_rel not in only_new:
                      continue
                  old_p = old_files[l_rel]
                  new_p = new_files[r_rel]
                  with open(old_p, 'r', encoding='utf-8', errors='ignore') as f1, \
                       open(new_p, 'r', encoding='utf-8', errors='ignore') as f2:
                      diff = list(difflib.unified_diff(
                          f1.readlines(), f2.readlines(),
                          fromfile=f"old/{l_rel} (renamed)", tofile=f"new/{r_rel}", n=3
                      ))
                  if diff:
                      diff_text = "".join(diff)
                      safe_name = f"RENAMED_{r_rel.replace('/', '.').replace('.smali', '')}"
                      with open(f"{DIR_MODIFIED}/classes/{safe_name}.diff", 'w', encoding='utf-8') as out:
                          out.write(diff_text)
                      f_all_mod.write(diff_text + "\n")
                      mod_count += 1
                  only_old.discard(l_rel)
                  only_new.discard(r_rel)

              for rel in only_old:
                  old_p = old_files[rel]
                  with open(old_p, 'r', encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()
                  diff_text = f"--- old/{rel}\n+++ /dev/null\n@@ -1,{len(lines)} +0,0 @@\n" + "".join(f"-{line}" for line in lines)
                  safe_name = rel.replace('/', '.').replace('.smali', '')
                  with open(f"{DIR_REMOVED}/classes/{safe_name}.diff", 'w', encoding='utf-8') as out:
                      out.write(diff_text)
                  f_all_rem.write(diff_text + "\n")
                  rem_count += 1

              for rel in only_new:
                  new_p = new_files[rel]
                  with open(new_p, 'r', encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()
                  diff_text = f"--- /dev/null\n+++ new/{rel}\n@@ -0,0 +1,{len(lines)} @@\n" + "".join(f"+{line}" for line in lines)
                  safe_name = rel.replace('/', '.').replace('.smali', '')
                  with open(f"{DIR_ADDED}/classes/{safe_name}.diff", 'w', encoding='utf-8') as out:
                      out.write(diff_text)
                  f_all_add.write(diff_text + "\n")
                  add_count += 1

          print(f"最终精炼结果: 真正修改类 {mod_count} 个，彻底删除 {rem_count} 个，纯新增 {add_count} 个")

      # ==========================================
      # 12. 打包 Diff 产物并输出报告
      # ==========================================
      - name: Package Diff Output
        if: steps.check_update.outputs.has_update == 'true' && steps.prepare_prev.outputs.has_prev_dex == 'true'
        run: |
          cd workspace
          zip -q -r diff_output.zip diff_output/ changed_smali/
          
          MOD_COUNT=$(find diff_output/1_MODIFIED/classes -name "*.diff" 2>/dev/null | wc -l)
          REM_COUNT=$(find diff_output/2_REMOVED/classes -name "*.diff" 2>/dev/null | wc -l)
          ADD_COUNT=$(find diff_output/3_ADDED/classes -name "*.diff" 2>/dev/null | wc -l)
          
          {
            echo ""
            echo "### Twinflame DEX 语义精准 Diff 变更汇总"
            echo "- 对比基准版本: \`${{ steps.prepare_prev.outputs.prev_tag }}\`"
            echo "- 核心修改业务类 (Modified): \`${MOD_COUNT}\` 个"
            echo "- 彻底废弃/删除类 (Removed): \`${REM_COUNT}\` 个"
            echo "- 纯新增业务类 (Added): \`${ADD_COUNT}\` 个"
            echo "- 详细产物: 见附件 \`diff_output.zip\`、\`diff_mapping.txt\` 及 \`report.json\`。"
            echo ""
          } > diff_notes.md
          
          cat diff_notes.md >> $GITHUB_STEP_SUMMARY
          rm -rf old_dex old_smali new_smali prev_download

      # ==========================================
      # 13. 安装 JADX 并执行全量反编译 (复用大 Swap 内存拉满)
      # ==========================================
      - name: Install JADX and Decompile Java Source
        if: steps.check_update.outputs.has_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bin
          
          JADX_VER=$(gh release view -R skylot/jadx --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || true)
          [ -z "$JADX_VER" ] && JADX_VER="1.5.1"
          echo "安装 JADX 版本: v${JADX_VER}..."
          
          curl -sL "https://github.com/skylot/jadx/releases/download/v${JADX_VER}/jadx-${JADX_VER}.zip" -o jadx.zip
          unzip -q -d bin/jadx jadx.zip
          chmod -R +x bin/jadx/bin
          
          cd workspace
          mkdir -p java_final
          
          DECOMPILE_ALL="${{ inputs.decompile_all }}"
          [ -z "$DECOMPILE_ALL" ] && DECOMPILE_ALL="true"
          
          # ★ 核心改动：复用系统当前开辟的全部 Swap，动态计算总容量并把 JADX 堆内存拉满（最高 60GB）
          TOTAL_MEM_GB=$(free -g | awk '/^Mem:/{m=$2} /^Swap:/{s=$2} END{print m+s}')
          JADX_HEAP=$(( TOTAL_MEM_GB - 8 ))
          if [ "$JADX_HEAP" -gt 60 ]; then
            JADX_HEAP=60
          elif [ "$JADX_HEAP" -lt 28 ]; then
            JADX_HEAP=28
          fi
          
          echo "=========================================="
          echo "🚀 正在执行【全量反编译】所有 DEX 字节码..."
          echo "检测到虚拟总容量: ${TOTAL_MEM_GB}GB | 联动为 JADX 分配最大堆内存: ${JADX_HEAP}GB"
          echo "=========================================="
          
          export JAVA_OPTS="-Xms4g -Xmx${JADX_HEAP}g -XX:+UseG1GC"
          THREADS=$(nproc || echo 4)
          
          if [ "$DECOMPILE_ALL" = "true" ]; then
            set +e
            "$GITHUB_WORKSPACE/bin/jadx/bin/jadx" \
              -d java_final \
              --no-res \
              --threads-count "$THREADS" \
              --no-debug-info \
              new_dex/*.dex
            EXIT_CODE=$?
            set -e
            echo "JADX 反编译结束，退出码: $EXIT_CODE"

          else
            echo "正在执行局部反编译..."
            mkdir -p java_raw
            set +e
            "$GITHUB_WORKSPACE/bin/jadx/bin/jadx" \
              -d java_raw \
              --no-res \
              --threads-count "$THREADS" \
              --no-debug-info \
              new_dex/*.dex
            set -e
            
            mkdir -p java_final/sources
            for pkg in com/tencent/mobileqq com/tencent/qqnt; do
              if [ -d "java_raw/sources/$pkg" ]; then
                mkdir -p "java_final/sources/$(dirname "$pkg")"
                mv "java_raw/sources/$pkg" "java_final/sources/$pkg"
              fi
            done
            rm -rf java_raw
          fi

          if [ -d "java_final/sources" ] && [ "$(ls -A java_final/sources 2>/dev/null)" ]; then
            mv java_final decompiled_java
            echo "正在打包全量 Java 源码为 java_output.zip ..."
            zip -q -r java_output.zip decompiled_java
            echo "✅ 全量 Java 源码打包完成！产物体积: $(du -sh java_output.zip | awk '{print $1}')"
          else
            mkdir -p decompiled_java
            echo "未提取到 Java 代码。" > decompiled_java/readme.txt
            zip -q -r java_output.zip decompiled_java
            echo "::error::JADX 反编译未产出任何源码文件"
            exit 1
          fi
          
          rm -rf new_dex target.apk

      # ==========================================
      # 14. 创建 GitHub Release
      # ==========================================
      - name: Create GitHub Release
        if: steps.check_update.outputs.has_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd workspace
          VERSION_SHORT="${{ steps.check_update.outputs.version_short }}"
          VERSION_FULL="${{ steps.check_update.outputs.version_full }}"
          APK_URL="${{ steps.check_update.outputs.apk_url }}"
          IS_BETA="${{ steps.check_update.outputs.is_beta }}"
          
          RELEASE_TITLE="QQ Android v${VERSION_SHORT}"
          EXTRA_FLAGS=""
          BETA_NOTE=""

          if [ "$IS_BETA" = "true" ]; then
            RELEASE_TITLE="QQ Android v${VERSION_SHORT} [Beta]"
            EXTRA_FLAGS="--prerelease"
            BETA_NOTE="> 当前版本被标记为 #Beta 测试版"
          fi

          ASSETS="java_output.zip dex_archive.zip"
          [ -f "diff_output.zip" ] && ASSETS="${ASSETS} diff_output.zip"
          [ -f "diff_mapping.txt" ] && ASSETS="${ASSETS} diff_mapping.txt"
          [ -f "report.json" ] && ASSETS="${ASSETS} report.json"

          {
            if [ -n "$BETA_NOTE" ]; then
              echo "$BETA_NOTE"
              echo ""
            fi
            echo "### QQ Android 自动分析产物说明"
            echo ""
            echo "- 应用版本: \`${VERSION_SHORT}\`"
            echo "- 安装包文件名: \`${VERSION_FULL}.apk\`"
            echo "- 测试版状态: \`${IS_BETA}\`"
            echo "- 官方下载直链: [点击从腾讯官方下载](${APK_URL})"
            echo "- 生成时间: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S') (北京时间)"
            echo ""
            if [ -f "subid_notes.md" ]; then
              cat subid_notes.md
              echo ""
            fi
            if [ -f "diff_notes.md" ]; then
              cat diff_notes.md
            fi
          } > release_notes.md

          echo "发布 Release: ${RELEASE_TITLE}"
          gh release create "v${VERSION_SHORT}" ${ASSETS} \
            --title "${RELEASE_TITLE}" \
            ${EXTRA_FLAGS} \
            --notes-file release_notes.md || \
          gh release upload "v${VERSION_SHORT}" ${ASSETS} --clobber

      # ==========================================
      # 15. 更新版本记录与多版本轮询
      # ==========================================
      - name: Commit and Push Version Update
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          echo "${{ steps.check_update.outputs.apk_url }}" > latest_version.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_version.txt
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update QQ APK record: ${{ steps.check_update.outputs.version_short }} [skip ci]"
            for i in {1..5}; do
              echo "[同步] 尝试拉取并推送最新版本记录 ($i/5)..."
              git fetch origin main
              if git rebase origin/main 2>/dev/null; then
                if git push origin main; then
                  echo "[成功] 版本记录已推送到 main 分支！"
                  break
                fi
              else
                git rebase --abort 2>/dev/null || true
                git pull --rebase origin main || true
                if git push origin main; then
                  echo "[成功] 版本记录已合并推送到 main 分支！"
                  break
                fi
              fi
              sleep 2
            done
          fi

      - name: Trigger Next Run If More Versions Pending
        if: steps.check_update.outputs.has_more == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检测到队列中还有未处理的版本，触发下一次工作流..."
          gh workflow run "Auto Decompile & Twinflame DEX Diff QQ APK"
