name: Auto Decompile QQ APK

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8:00 (UTC 0:00) 自动执行检测
  workflow_dispatch:
    inputs:
      decompile_all:
        description: '是否完整反编译整个 APK (注意：产物文件极大，耗时较长)'
        required: true
        type: boolean
        default: false
      decompile_mobileqq:
        description: '是否反编译 com.tencent.mobileqq (非完整反编译时生效)'
        required: true
        type: boolean
        default: true
      decompile_qqnt:
        description: '是否反编译 com.tencent.qqnt (非完整反编译时生效)'
        required: true
        type: boolean
        default: true

jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 用于推送版本记录与发布 Release
      actions: write  # 用于当检测到同天有多个版本积压时自动续跑

    steps:
      # ==========================================
      # 1. 基础环境准备
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. 自动检测更新（排队机制：按时间从旧到新依次处理，防止漏包）
      # ==========================================
      - name: Check for QQ Update
        id: check_update
        run: |
          echo "=== 正在从 Telegram 获取 QQ APK 更新队列 ==="
          
          python3 - << 'EOF'
          import urllib.request
          import re
          import os

          url = "https://t.me/s/qq_updatelog"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
          
          try:
              html = urllib.request.urlopen(req).read().decode('utf-8')
          except Exception as e:
              print(f"Error fetching TG channel: {e}")
              exit(1)

          old_url = ""
          if os.path.exists("latest_version.txt"):
              with open("latest_version.txt", "r", encoding="utf-8") as f:
                  old_url = f.read().strip()

          messages = html.split('class="tgme_widget_message_wrap')
          
          apk_entries = []
          for msg in messages:
              urls = re.findall(r'https://downv6\.qq\.com/qqweb/QQ_1/android_apk/[a-zA-Z0-9_.-]+\.apk', msg)
              if urls:
                  apk_entries.append({
                      'url': urls[-1],
                      'msg': msg
                  })

          if not apk_entries:
              print("错误: 未能在 Telegram 频道找到任何有效的 APK 下载链接。")
              exit(1)

          # 寻找待处理的版本队列（取 old_url 之后发布的所有版本）
          pending_entries = []
          if not old_url:
              pending_entries = [apk_entries[-1]]
          else:
              found_old = False
              for item in apk_entries:
                  if item['url'] == old_url:
                      found_old = True
                      continue
                  if found_old:
                      pending_entries.append(item)
              
              if not found_old and apk_entries:
                  pending_entries = [apk_entries[-1]]

          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          has_update = len(pending_entries) > 0 or (event_name == 'workflow_dispatch')

          if not pending_entries and event_name == 'workflow_dispatch':
              pending_entries = [apk_entries[-1]]

          if not has_update or not pending_entries:
              print("未检测到新版本，跳过本次处理。")
              github_output = os.environ.get('GITHUB_OUTPUT')
              with open(github_output, 'a', encoding='utf-8') as f:
                  f.write("has_update=false\n")
                  f.write("has_more=false\n")
              exit(0)

          # 先进先出：处理待处理队列中最早发布的一个
          target_entry = pending_entries[0]
          has_more = len(pending_entries) > 1

          target_url = target_entry['url']
          target_msg = target_entry['msg']

          is_beta = "true" if re.search(r'#beta', target_msg, re.IGNORECASE) else "false"

          ver_match = re.search(r'QQ(?:_NT)?\s+([0-9.]+)', target_msg, re.IGNORECASE)
          if not ver_match:
              ver_match = re.search(r'\b([0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?)\b', target_msg)

          filename = target_url.split('/')[-1].replace('.apk', '')
          version_short = ver_match.group(1) if ver_match else filename.split('_')[0]

          with open("latest_version.txt", "w", encoding="utf-8") as f:
              f.write(target_url)

          github_output = os.environ.get('GITHUB_OUTPUT')
          with open(github_output, 'a', encoding='utf-8') as f:
              f.write(f"apk_url={target_url}\n")
              f.write(f"version_short={version_short}\n")
              f.write(f"version_full={filename}\n")
              f.write(f"is_beta={is_beta}\n")
              f.write("has_update=true\n")
              f.write(f"has_more={'true' if has_more else 'false'}\n")

          print(f"=== 本次待反编译版本: {version_short} ===")
          print(f"队列是否还有后续未处理版本: {has_more} (剩余待处理: {len(pending_entries) - 1})")
          EOF

      # ==========================================
      # 3. 提交版本记录更新
      # ==========================================
      - name: Commit and Push Version Update
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_version.txt
          git commit -m "Auto-update QQ APK version record: ${{ steps.check_update.outputs.version_short }} [skip ci]" || echo "No changes to commit"
          git push

      # ==========================================
      # 4. 清理磁盘空间并检测最优存储路径
      # ==========================================
      - name: Free Disk Space (Cleanup) & Detect Best Drive
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          
          MNT_AVAIL=$(df -k /mnt 2>/dev/null | tail -n 1 | awk '{print $4}')
          ROOT_AVAIL=$(df -k / 2>/dev/null | tail -n 1 | awk '{print $4}')
          
          [ -z "$MNT_AVAIL" ] && MNT_AVAIL=0
          
          if [ "$MNT_AVAIL" -gt "$ROOT_AVAIL" ]; then
            echo "TARGET_DIR=/mnt" >> $GITHUB_ENV
          else
            echo "TARGET_DIR=" >> $GITHUB_ENV
          fi

      # ==========================================
      # 5. 开启 32GB Swap 虚拟内存
      # ==========================================
      - name: Create 32GB Swap Space
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          if [ "${{ env.TARGET_DIR }}" = "/mnt" ]; then
            SWAP_PATH="/mnt/swapfile"
          else
            SWAP_PATH="/swapfile"
          fi
          
          sudo swapoff -a || true
          sudo fallocate -l 32G $SWAP_PATH
          sudo chmod 600 $SWAP_PATH
          sudo mkswap $SWAP_PATH
          sudo swapon $SWAP_PATH
          free -h

      # ==========================================
      # 6. 环境准备 (JDK 17)
      # ==========================================
      - name: Set up JDK 17
        if: steps.check_update.outputs.has_update == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==========================================
      # 7. 下载 APK
      # ==========================================
      - name: Download APK from Latest Link
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          if [ "${{ env.TARGET_DIR }}" = "/mnt" ]; then
            REAL_WORKSPACE="/mnt/workspace"
            sudo mkdir -p $REAL_WORKSPACE
            sudo chown -R runner:runner $REAL_WORKSPACE
          else
            REAL_WORKSPACE="$GITHUB_WORKSPACE/workspace_real"
            mkdir -p $REAL_WORKSPACE
          fi
          
          rm -rf workspace || true
          ln -sf $REAL_WORKSPACE workspace
          
          cd workspace
          echo "Downloading APK: ${{ steps.check_update.outputs.apk_url }}"
          curl -L "${{ steps.check_update.outputs.apk_url }}" -o target.apk
          du -sh target.apk

      # ==========================================
      # 8. 安装 JADX
      # ==========================================
      - name: Install JADX
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          mkdir -p bin
          JADX_VERSION=$(curl -s https://api.github.com/repos/skylot/jadx/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -L "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip" -o jadx.zip
          unzip -d bin/jadx jadx.zip
          chmod -R +x bin/jadx/bin
          echo "$GITHUB_WORKSPACE/bin/jadx/bin" >> $GITHUB_PATH

      # ==========================================
      # 9. 执行反编译
      # ==========================================
      - name: Decompile APK
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          cd workspace
          mkdir -p java_final
          
          echo "Extracting classes*.dex..."
          unzip -q target.apk "classes*.dex" -d dex_extracted
          
          FILTER=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.decompile_all }}" = "false" ]; then
            if [ "${{ inputs.decompile_mobileqq }}" = "true" ] && [ "${{ inputs.decompile_qqnt }}" = "true" ]; then
              FILTER="com.tencent.mobileqq,com.tencent.qqnt"
            elif [ "${{ inputs.decompile_mobileqq }}" = "true" ]; then
              FILTER="com.tencent.mobileqq"
            elif [ "${{ inputs.decompile_qqnt }}" = "true" ]; then
              FILTER="com.tencent.qqnt"
            fi
          fi
          
          export JAVA_OPTS="-Xmx30g"
          
          set +e
          if [ -n "$FILTER" ]; then
            echo "局部反编译: $FILTER"
            jadx -d java_final --no-res --threads-count 1 --no-debug-info --show-only "$FILTER" dex_extracted/*.dex
          else
            echo "完整反编译..."
            jadx -d java_final --no-res --threads-count 2 dex_extracted/*.dex
          fi
          
          EXIT_CODE=$?
          set -e
          
          if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 3 ]; then
            echo "JADX 完成，状态码: $EXIT_CODE"
          else
            echo "JADX 失败，退出码: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          
          rm -rf dex_extracted

      # ==========================================
      # 10. 打包源码产物
      # ==========================================
      - name: Zip Decompiled Files
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          cd workspace
          if [ -d "java_final" ] && [ "$(ls -A java_final)" ]; then
            mv java_final decompiled_java
            zip -r java_output.zip decompiled_java
          else
            mkdir -p decompiled_java
            echo "No package selection was made or no code was found." > decompiled_java/readme.txt
            zip -r java_output.zip decompiled_java
          fi

      # ==========================================
      # 11. 【秒级完成】智能 Hash 预筛选 + 精准 Diff 引擎
      # ==========================================
      - name: Generate Smart Diff with Previous Release
        if: steps.check_update.outputs.has_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd workspace
          CURRENT_TAG="v${{ steps.check_update.outputs.version_short }}"
          
          # 获取最近的一个历史版本 Release Tag（排除当前版本自身）
          PREV_TAG=$(gh release list --limit 10 --json tagName -q '.[].tagName' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
          export PREV_TAG
          
          echo "当前版本 Tag: ${CURRENT_TAG}"
          echo "比对的上一个版本 Tag: ${PREV_TAG}"
          
          echo "" > diff_notes.md
          
          if [ -z "$PREV_TAG" ]; then
            echo "未找到上一个 Release 版本，跳过 Diff。"
            echo -e "\n- **代码对比：** 未检测到历史版本，本版本为初始发布版本。\n" >> diff_notes.md
          else
            echo "正在下载上一版本产物: ${PREV_TAG} ..."
            mkdir -p prev_download prev_code
            
            if gh release download "$PREV_TAG" -p "java_output.zip" -D prev_download; then
              echo "解压上一版本源码..."
              unzip -q prev_download/java_output.zip -d prev_code/
              
              PREV_DIR="prev_code/decompiled_java"
              CURR_DIR="decompiled_java"
              
              if [ -d "$PREV_DIR" ] && [ -d "$CURR_DIR" ]; then
                echo "=== 启动高性能智能 Diff 引擎 ==="
                
                python3 - << 'PYEOF'
                import os
                import difflib
                import hashlib
                import zipfile

                dir_old = "prev_code/decompiled_java"
                dir_new = "decompiled_java"
                prev_tag = os.environ.get('PREV_TAG', 'Unknown')

                def get_files_dict(base_dir):
                    f_dict = {}
                    for root, _, files in os.walk(base_dir):
                        for f in files:
                            full_p = os.path.join(root, f)
                            rel_p = os.path.relpath(full_p, base_dir)
                            try:
                                f_dict[rel_p] = os.path.getsize(full_p)
                            except OSError:
                                pass
                    return f_dict

                print("正在快速建立两版文件索引树...")
                files_old = get_files_dict(dir_old)
                files_new = get_files_dict(dir_new)

                set_old = set(files_old.keys())
                set_new = set(files_new.keys())

                added = sorted(list(set_new - set_old))
                deleted = sorted(list(set_old - set_new))
                common = set_old & set_new

                def calc_md5(filepath):
                    h = hashlib.md5()
                    with open(filepath, 'rb') as f:
                        while chunk := f.read(65536):
                            h.update(chunk)
                    return h.hexdigest()

                modified = []
                print(f"正在比对共有文件 (共 {len(common)} 个)...")
                for rel_p in common:
                    # 先比大小；大小不同必被修改；大小相同再测 MD5
                    if files_old[rel_p] != files_new[rel_p]:
                        modified.append(rel_p)
                    else:
                        path_o = os.path.join(dir_old, rel_p)
                        path_n = os.path.join(dir_new, rel_p)
                        if calc_md5(path_o) != calc_md5(path_n):
                            modified.append(rel_p)

                modified.sort()
                print(f"比对完成: 新增 {len(added)} | 删除 {len(deleted)} | 修改 {len(modified)}")

                # 仅对真正发生同名代码修改的文件生成高价值 Unified Diff
                diff_patch_path = "diff.patch"
                print(f"正在对 {len(modified)} 个修改文件生成行级 Diff Patch...")
                with open(diff_patch_path, "w", encoding="utf-8", errors="replace") as patch_out:
                    for rel_p in modified:
                        file_o = os.path.join(dir_old, rel_p)
                        file_n = os.path.join(dir_new, rel_p)
                        try:
                            with open(file_o, 'r', encoding='utf-8', errors='replace') as fo, \
                                 open(file_n, 'r', encoding='utf-8', errors='replace') as fn:
                                diff_lines = difflib.unified_diff(
                                    fo.readlines(),
                                    fn.readlines(),
                                    fromfile=f"a/{rel_p}",
                                    tofile=f"b/{rel_p}",
                                    n=3
                                )
                                patch_out.writelines(diff_lines)
                        except Exception as e:
                            print(f"跳过异常文件 {rel_p}: {e}")

                # 将 patch 压缩为 zip
                with zipfile.ZipFile("diff.patch.zip", "w", zipfile.ZIP_DEFLATED) as zf:
                    zf.write(diff_patch_path, arcname="diff.patch")
                if os.path.exists(diff_patch_path):
                    os.remove(diff_patch_path)

                # 生成 Markdown 统计摘要
                with open("diff_notes.md", "w", encoding="utf-8") as out:
                    out.write(f"\n### 🔍 代码变更智能 Diff (对比上一版本)\n\n")
                    out.write(f"- **对比基准版本：** `{prev_tag}`\n")
                    out.write(f"- **变更文件汇总：** 🟡 修改 `{len(modified)}` 个 | 🟢 新增 `{len(added)}` 个 | 🔴 删除 `{len(deleted)}` 个\n")
                    out.write(f"- **精炼补丁包：** 见 Release 附件 `diff.patch.zip`（仅收录实质性改动的精简补丁）\n\n")

                    key_modified = [f for f in modified if "qqnt" in f or "mobileqq" in f][:30]
                    if key_modified:
                        out.write("<details><summary><b>点击展开核心业务修改文件列表 (前 30 个)</b></summary>\n\n```text\n")
                        for f in key_modified:
                            out.write(f"[MODIFIED] {f}\n")
                        if len(modified) > 30:
                            out.write(f"... 其余 {len(modified) - 30} 个改动文件详见 diff.patch.zip\n")
                        out.write("```\n</details>\n\n")
                PYEOF

              fi
            else
              echo "下载上一版本产物失败，跳过 Diff。"
              echo -e "\n- **代码对比：** 未能下载到 \`${PREV_TAG}\` 的产物文件。\n" >> diff_notes.md
            fi
            
            # 立即清理旧版解压目录，彻底释放磁盘
            rm -rf prev_download prev_code
          fi

      # ==========================================
      # 12. 上传 Artifact 备份
      # ==========================================
      - name: Upload Decoupled Artifacts
        if: steps.check_update.outputs.has_update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qq-decompiled-${{ steps.check_update.outputs.version_short }}
          path: workspace/java_output.zip
          retention-days: 7

      # ==========================================
      # 13. 创建 GitHub Release（附带 Diff 附件与智能说明）
      # ==========================================
      - name: Create GitHub Release
        if: steps.check_update.outputs.has_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_SHORT="${{ steps.check_update.outputs.version_short }}"
          VERSION_FULL="${{ steps.check_update.outputs.version_full }}"
          APK_URL="${{ steps.check_update.outputs.apk_url }}"
          IS_BETA="${{ steps.check_update.outputs.is_beta }}"
          
          RELEASE_TITLE="QQ Android v${VERSION_SHORT}"
          EXTRA_FLAGS=""
          BETA_NOTE=""

          if [ "$IS_BETA" = "true" ]; then
            RELEASE_TITLE="QQ Android v${VERSION_SHORT} [Beta]"
            EXTRA_FLAGS="--prerelease"
            BETA_NOTE="> **当前版本被 Telegram 频道标记的 #Beta 测试版本**\n\n"
          fi

          # 收集待上传附件
          ASSETS="workspace/java_output.zip"
          if [ -f "workspace/diff.patch.zip" ]; then
            ASSETS="${ASSETS} workspace/diff.patch.zip"
          fi

          DIFF_CONTENT=""
          if [ -f "workspace/diff_notes.md" ]; then
            DIFF_CONTENT=$(cat workspace/diff_notes.md)
          fi

          # 构造完整的 Release Markdown，避免转义符引起的解析错误
          cat << EOF > workspace/release_notes.md
          ${BETA_NOTE}### QQ Android 自动反编译产物说明

          - **应用版本：** \`${VERSION_SHORT}\`
          - **安装包文件名：** \`${VERSION_FULL}.apk\`
          - **测试版状态：** \`${IS_BETA}\`
          - **官方下载直链：** [点击从腾讯官方下载](${APK_URL})
          - **自动生成时间：** $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M:%S') (北京时间)

          ${DIFF_CONTENT}
          EOF

          echo "=== 正在创建 GitHub Release: ${RELEASE_TITLE} ==="
          
          gh release create "v${VERSION_SHORT}" ${ASSETS} \
            --title "${RELEASE_TITLE}" \
            ${EXTRA_FLAGS} \
            --notes-file workspace/release_notes.md || \
          gh release upload "v${VERSION_SHORT}" ${ASSETS} --clobber

      # ==========================================
      # 14. 如果还有未完成版本，自动触发下一次工作流
      # ==========================================
      - name: Trigger Next Run If More Versions Pending
        if: steps.check_update.outputs.has_more == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检测到队列中还有待处理的版本，正在自动触发下一个版本的反编译任务..."
          gh workflow run "Auto Decompile QQ APK"
