name: Test Download QQ IPA (Linux)

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: '首次认证 6 位验证码 (手机收到弹窗或短信时填入)'
        required: false
        type: string
        default: ''

jobs:
  download-ipa:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装官方 ipatool v2.7.0
        run: |
          echo "[状态] 正在拉取官方 ipatool v2.7.0..."
          curl -fL --retry 3 --connect-timeout 20 -o ipatool.tar.gz \
            "https://github.com/majd/ipatool/releases/download/v2.7.0/ipatool-2.7.0-linux-amd64.tar.gz"
          
          tar -zxvf ipatool.tar.gz
          sudo mv bin/ipatool* /usr/local/bin/ipatool
          sudo chmod +x /usr/local/bin/ipatool
          ipatool --version

      - name: 3. 恢复已有登录会话 (若存在且有效则免密)
        id: restore_session
        env:
          SESSION_BASE64: ${{ secrets.IPATOOL_SESSION_BASE64 }}
        run: |
          if [ -n "$SESSION_BASE64" ]; then
            echo "[凭据恢复] 检测到已保存的 ipatool Session，正在校验并还原..."
            echo "$SESSION_BASE64" | base64 -d > /tmp/test_session.tar.gz 2>/dev/null || true
            
            # 校验 tarball 完整性
            if tar -ztvf /tmp/test_session.tar.gz >/dev/null 2>&1; then
              tar -zxvf /tmp/test_session.tar.gz -C "$HOME"
              echo "has_session=true" >> $GITHUB_OUTPUT
              echo "[凭据恢复] 恢复成功，后续将跳过 2FA 登录流程！"
            else
              echo "::warning::已保存的 Session 数据不完整或被截断，本次将自动重新登录生成完整凭据！"
              echo "has_session=false" >> $GITHUB_OUTPUT
            fi
            rm -f /tmp/test_session.tar.gz
          else
            echo "[凭据检查] 未检测到已持久化的 Session，需要进行登录认证。"
            echo "has_session=false" >> $GITHUB_OUTPUT
          fi

      - name: 4. 执行 Apple ID 登录并捕获完整会话
        if: steps.restore_session.outputs.has_session != 'true'
        env:
          APPLE_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_PWD: ${{ secrets.APPLE_ID_PASSWORD }}
          AUTH_CODE: ${{ inputs.auth_code }}
        run: |
          echo "[认证] 正在登录 Apple ID..."
          
          if [ -z "$AUTH_CODE" ]; then
            echo "::warning::未传入 2FA 验证码，正在向苹果发起请求并触发向手机发送验证码..."
            ipatool --keychain-passphrase "ipatoolpass123" auth login \
              --email "$APPLE_EMAIL" \
              --password "$APPLE_PWD" \
              --non-interactive || true
            echo "::error::验证码已推送到你的手机，请查看最新 6 位数并在重新触发本工作流时填入输入框！"
            exit 1
          fi

          # 携带当前 2FA 验证码完成最终鉴权
          ipatool --keychain-passphrase "ipatoolpass123" auth login \
            --email "$APPLE_EMAIL" \
            --password "$APPLE_PWD" \
            --auth-code "$AUTH_CODE" \
            --non-interactive

          echo "=========================================================="
          echo "🎉 登录成功！正在生成完整持久化会话凭据..."
          echo "=========================================================="
          
          mkdir -p /tmp/session_export
          cd "$HOME"
          tar -zcvf /tmp/session_export/ipatool_session.tar.gz .ipatool .config/ipatool 2>/dev/null || tar -zcvf /tmp/session_export/ipatool_session.tar.gz .ipatool
          
          # 采用标准 76 列折行 base64，彻底杜绝单行被 GitHub 页面截断
          base64 /tmp/session_export/ipatool_session.tar.gz > /tmp/session_export/session_base64.txt
          
          echo "------------------- BEGIN IPATOOL SESSION -------------------"
          cat /tmp/session_export/session_base64.txt
          echo "-------------------- END IPATOOL SESSION --------------------"

      - name: 5. 备份 Session 文件为 Artifact (防截断兜底)
        if: steps.restore_session.outputs.has_session != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ipatool-auth-session
          path: /tmp/session_export/session_base64.txt
          retention-days: 1

      - name: 6. 购买许可并下载 QQ (.ipa)
        run: |
          mkdir -p ipa_output
          cd ipa_output
          
          echo "[下载] 正在调用 App Store 购买并下载 QQ (Bundle ID: com.tencent.mqq)..."
          ipatool --keychain-passphrase "ipatoolpass123" download \
            -b com.tencent.mqq \
            --purchase
          
          ls -lh

      - name: 7. 上传 IPA 为制品 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: QQ_iOS_IPA
          path: ipa_output/*.ipa
          retention-days: 2
