name: Test Download QQ IPA (Linux)

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: '苹果双重认证 6 位验证码 (手机收到弹窗填入，首次可留空)'
        required: false
        type: string
        default: ''

jobs:
  download-ipa:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 获取官方 ipatool v2.7.0 二进制
        run: |
          echo "[状态] 正在直接拉取官方 ipatool-2.7.0-linux-amd64.tar.gz..."
          curl -fL \
            --retry 3 \
            --connect-timeout 20 \
            -o ipatool.tar.gz \
            "https://github.com/majd/ipatool/releases/download/v2.7.0/ipatool-2.7.0-linux-amd64.tar.gz"
          
          # 解压并部署二进制
          tar -zxvf ipatool.tar.gz
          sudo mv bin/ipatool-linux-amd64 /usr/local/bin/ipatool
          sudo chmod +x /usr/local/bin/ipatool
          ipatool --version

      - name: 3. 认证 Apple ID
        env:
          APPLE_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_PWD: ${{ secrets.APPLE_ID_PASSWORD }}
          AUTH_CODE: ${{ inputs.auth_code }}
        run: |
          echo "[认证] 正在登录 Apple ID..."
          if [ -n "$AUTH_CODE" ]; then
            ipatool auth login --email "$APPLE_EMAIL" --password "$APPLE_PWD" --auth-code "$AUTH_CODE" --non-interactive
          else
            ipatool auth login --email "$APPLE_EMAIL" --password "$APPLE_PWD" --non-interactive
          fi

      - name: 4. 购买许可并下载 QQ (.ipa)
        run: |
          mkdir -p ipa_output
          cd ipa_output
          
          echo "[下载] 正在调用 App Store 购买并下载 QQ (Bundle ID: com.tencent.mqq)..."
          # --purchase: 若未购买过会自动领取免费许可
          ipatool download -b com.tencent.mqq --purchase
          
          ls -lh

      - name: 5. 上传 IPA 为制品 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: QQ_iOS_IPA
          path: ipa_output/*.ipa
          retention-days: 2
