name: Test Download & Extract Decrypted QQ IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: '指定下载版本 (默认 latest-available 最新版，例如 9.3.78)'
        required: false
        type: string
        default: 'latest-available'

jobs:
  download-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装分析工具链 (ripgrep & p7zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep p7zip-full jq curl

      - name: 3. 从 ARMConverter 下载已脱壳的明文 QQ IPA
        id: download_ipa
        env:
          SESSION_TOKEN: ${{ secrets.ARMCONVERTER_SESSION }}
          TARGET_VER: ${{ inputs.version }}
        run: |
          APP_ID="444934666"
          BUNDLE_ID="com.tencent.mqq"
          
          if [ -z "$SESSION_TOKEN" ]; then
            echo "::error::未检测到 ARMCONVERTER_SESSION，请在仓库 Settings 中添加该 Secret！"
            exit 1
          fi

          echo "[1/4] 正在查询 QQ 线上脱壳版本列表..."
          VERSIONS_JSON=$(curl -s -X POST \
            --cookie "session=$SESSION_TOKEN" \
            -H "Referer: https://armconverter.com/decryptedappstore" \
            "https://armconverter.com/decryptedappstore/versions/$APP_ID/0?country=cn")

          if [ "$TARGET_VER" = "latest-available" ]; then
            REAL_VER=$(echo "$VERSIONS_JSON" | jq -r '.versions[-1].ver')
          else
            REAL_VER="$TARGET_VER"
          fi

          echo "目标版本: $REAL_VER"
          echo "version=$REAL_VER" >> $GITHUB_OUTPUT

          echo "[2/4] 正在向 ARMConverter 申请下载 Token..."
          PREPARE_RES=$(curl -s -X POST \
            --cookie "session=$SESSION_TOKEN" \
            -H "Referer: https://armconverter.com/decryptedappstore" \
            "https://armconverter.com/decryptedappstore/download/$APP_ID/$BUNDLE_ID/$REAL_VER/prepare")

          DL_TOKEN=$(echo "$PREPARE_RES" | jq -r '.token')
          ERR_MSG=$(echo "$PREPARE_RES" | jq -r '.error // empty')

          if [ -n "$ERR_MSG" ] || [ -z "$DL_TOKEN" ] || [ "$DL_TOKEN" = "null" ]; then
            echo "::error::获取下载授权失败: $PREPARE_RES (可能是 Session 过期或触发了下载配额限制)"
            exit 1
          fi

          echo "[3/4] 正在高速下载已脱壳的 QQ.ipa ($REAL_VER)..."
          curl -fL \
            -o "QQ_decrypted.ipa" \
            "https://armconverter.com/decryptedappstore/download/$APP_ID/$BUNDLE_ID/$REAL_VER?token=$DL_TOKEN"

          ls -lh QQ_decrypted.ipa

          echo "[4/4] 验证 IPA 文件完整性..."
          zip -T QQ_decrypted.ipa

      - name: 4. 自动解包并提取 Info.plist
        run: |
          mkdir -p qq_decrypted_out
          unzip -q QQ_decrypted.ipa -d qq_decrypted_out/
          
          cd qq_decrypted_out/Payload/QQ.app
          
          echo "=========================================="
          echo "📱 应用基础元数据信息："
          python3 -c "
          import plistlib
          try:
              pl = plistlib.load(open('Info.plist', 'rb'))
              print('- 外显版本 (CFBundleShortVersionString):', pl.get('CFBundleShortVersionString'))
              print('- 内部构建号 (CFBundleVersion):', pl.get('CFBundleVersion'))
              print('- 最低系统要求 (MinimumOSVersion):', pl.get('MinimumOSVersion'))
          except Exception as e:
              print('解析 Info.plist 异常:', e)
          "
          echo "=========================================="

      - name: 5. 扫描脱壳明文 Mach-O 二进制，秒抓 SubID
        run: |
          cd qq_decrypted_out/Payload/QQ.app
          
          echo "=========================================="
          echo "🚀 正在全量检索脱壳主程序的 537 识别码..."
          echo "=========================================="
          
          python3 -c "
          import re
          data = open('QQ', 'rb').read()
          
          matches = list(re.finditer(rb'(?<![0-9])(537[0-9]{6})(?![0-9])', data))
          print(f'共扫描到 {len(matches)} 处 537 开头的 9 位数字')
          
          found_subids = set()
          for m in matches:
              subid = m.group(1).decode('ascii')
              start = max(0, m.start() - 60)
              end = min(len(data), m.end() + 60)
              ctx_bytes = data[start:end]
              
              # 过滤着色器浮点数（排除 float/vec/material 等噪点）
              if any(k in ctx_bytes for k in [b'float', b'vec2', b'vec4', b'materialParams']):
                  continue
                  
              readable = ''.join(chr(b) if 32 <= b < 127 else '.' for b in ctx_bytes)
              print(f'\n🔥 [高价值候选 SubID: {subid}] 偏移量: {m.start()}')
              print('上下文:', readable)
              found_subids.add(subid)
          
          print('\n==========================================')
          print('🎯 最终提取到的 SubID 候选集:', found_subids)
          print('==========================================')
          "

      - name: 6. 上传已脱壳的 IPA 为制品 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: QQ_iOS_Decrypted_IPA
          path: QQ_decrypted.ipa
          retention-days: 2
